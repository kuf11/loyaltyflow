<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки LoyaltyFlow</title><style>body{margin:0;background:#f3f6f5;color:#172321;font:15px Arial;padding:28px}main{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe7e4;border-radius:13px;padding:18px;margin:12px 0}input,button{padding:11px;border:1px solid #dfe7e4;border-radius:8px}button{background:#22a77a;color:#fff;font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}</style></head><body><main><h1>Заявки на доступ</h1><div class="card"><input id="key" type="password" placeholder="Ключ администратора"><button onclick="load()">Загрузить</button></div><div id="list"></div></main><script>async function load(){let r=await fetch('/api/v1/admin/pending',{headers:{'X-Admin-Key':key.value}}),x=await r.json();if(!r.ok)return list.textContent=x.error;list.innerHTML=x.users.length?x.users.map(u=>'<div class="card row"><div><b>'+u.full_name+'</b> — '+u.company+'<br>'+u.email+' · '+u.phone+' · '+u.city+', '+u.age+'</div><button onclick="approve(\''+u.id+'\')">Одобрить и запустить 7 дней</button></div>').join(''):'<div class="card">Новых заявок нет</div>'}async function approve(id){let r=await fetch('/api/v1/admin/approve/'+id,{method:'POST',headers:{'X-Admin-Key':key.value}});if(r.ok)load();else alert('Ошибка')}</script></body></html>
