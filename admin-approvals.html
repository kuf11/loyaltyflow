<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заявки LoyaltyFlow</title><style>body{margin:0;background:#f3f6f5;color:#172321;font:15px Arial;padding:28px}main{max-width:1000px;margin:auto}.card{background:#fff;border:1px solid #dfe7e4;border-radius:13px;padding:18px;margin:12px 0}input,button{padding:11px;border:1px solid #dfe7e4;border-radius:8px}button{background:#22a77a;color:#fff;font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}</style></head><body><main><h1>Заявки на доступ</h1><div class="card"><input id="key" type="password" placeholder="Ключ администратора"><button id="loadButton">Загрузить</button></div><div id="list"></div></main><script>const key=document.getElementById('key'),list=document.getElementById('list');document.getElementById('loadButton').addEventListener('click',load);function card(text){const node=document.createElement('div');node.className='card';node.textContent=text;return node}async function load(){const r=await fetch('/api/v1/admin/pending',{headers:{'X-Admin-Key':key.value}}),x=await r.json();list.replaceChildren();if(!r.ok){list.textContent=String(x.error||'Ошибка');return}if(!x.users.length){list.appendChild(card('Новых заявок нет'));return}for(const u of x.users){const row=document.createElement('div');row.className='card row';const info=document.createElement('div'),name=document.createElement('b');name.textContent=String(u.full_name||'');info.append(name,' — '+String(u.company||''),document.createElement('br'),String(u.email||'')+' · '+String(u.phone||'')+' · '+String(u.city||'')+', '+String(u.age??''));const button=document.createElement('button');button.textContent='Одобрить и запустить 7 дней';button.addEventListener('click',()=>approve(String(u.id||'')));row.append(info,button);list.appendChild(row)}}async function approve(id){const r=await fetch('/api/v1/admin/approve/'+encodeURIComponent(id),{method:'POST',headers:{'X-Admin-Key':key.value}});if(r.ok)return load();list.replaceChildren(card('Не удалось одобрить заявку'))}</script></body></html>
