<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — LoyaltyFlow</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#172321;font:15px Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(560px,100%);background:#fff;border:1px solid #dfe7e4;border-radius:16px;padding:28px;box-shadow:0 20px 60px #102c2815}.logo{font-size:22px;font-weight:800;margin-bottom:25px}.logo b{background:#22a77a;color:#fff;padding:8px 11px;border-radius:10px;margin-right:8px}.tabs{display:flex;gap:8px}.tabs button,.btn{border:1px solid #dfe7e4;background:#fff;padding:11px 14px;border-radius:9px;font-weight:700;cursor:pointer}.tabs .on,.primary{background:#22a77a!important;color:#fff;border-color:#22a77a!important}.field{display:grid;gap:6px;margin:13px 0}.field input{padding:12px;border:1px solid #dfe7e4;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.msg{margin-top:15px;padding:12px;border-radius:9px;background:#eef7f4}.hide{display:none}@media(max-width:550px){.row{grid-template-columns:1fr}}</style></head><body><main class="box"><div class="logo"><b>L</b>LoyaltyFlow</div><div class="tabs"><button id="regTab" class="on" onclick="tab('reg')">Регистрация</button><button id="loginTab" onclick="tab('login')">Вход</button></div><form id="reg" onsubmit="register(event)"><h2>Заявка на доступ</h2><div class="row"><label class="field">ФИО<input name="fullName" required></label><label class="field">Компания<input name="company" required></label><label class="field">Возраст<input name="age" type="number" min="14" max="100" required></label><label class="field">Город<input name="city" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Телефон<input name="phone" required></label></div><label class="field">Пароль<input name="password" type="password" minlength="8" required><small>Минимум 8 символов, буква, цифра и # или @</small></label><button class="btn primary">Зарегистрироваться</button></form><form id="verify" class="hide" onsubmit="verify(event)"><h2>Подтверждение email</h2><p>Введите шестизначный код.</p><label class="field">Код<input name="code" inputmode="numeric" maxlength="6" required></label><button class="btn primary">Подтвердить</button></form><form id="login" class="hide" onsubmit="login(event)"><h2>Вход</h2><label class="field">Email<input name="email" type="email" required></label><label class="field">Пароль<input name="password" type="password" required></label><button class="btn primary">Войти</button><p>Тариф после пробного периода: <b>5 000 ₽/месяц</b>. Оплата будет подключена позже.</p></form><div id="message"></div></main><script>let email='';const message=x=>document.querySelector('#message').innerHTML='<div class="msg">'+x+'</div>';function tab(x){for(let id of ['reg','verify','login'])document.querySelector('#'+id).classList.add('hide');document.querySelector('#'+x).classList.remove('hide');regTab.classList.toggle('on',x==='reg');loginTab.classList.toggle('on',x==='login')}async function call(url,body){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка');return x}async function register(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let x=await call('/api/v1/auth/register',f);email=f.email;tab('verify');message(x.testCode?'Тестовый код: <b>'+x.testCode+'</b>':x.message)}catch(x){message(x.message)}}async function verify(e){e.preventDefault();try{let x=await call('/api/v1/auth/verify',{email,code:new FormData(e.target).get('code')});message(x.message);setTimeout(()=>tab('login'),1200)}catch(x){message(x.message)}}async function login(e){e.preventDefault();try{let x=await call('/api/v1/auth/login',Object.fromEntries(new FormData(e.target)));localStorage.setItem('LF_TOKEN',x.token);location.href='/'}catch(x){message(x.message)}}</script></body></html>
