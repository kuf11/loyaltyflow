<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Рассылка — LoyaltyFlow</title><link rel="stylesheet" href="/admin.css?v=1"><link rel="stylesheet" href="/broadcasts.css?v=1&modal=2"></head><body><div class="broadcast-shell"><aside class="broadcast-side"><a class="broadcast-brand" href="/"><span>L</span>LoyaltyFlow</a><nav><a href="/">← Кабинет</a><a class="active" href="/broadcasts.html">✦ Рассылка</a><a id="platformLink" href="/platform-admin.html" hidden>♙ Пользователи</a></nav></aside><main class="broadcast-main"><header class="broadcast-head"><div><span class="eyebrow">Коммуникации</span><h1>Новая рассылка</h1><p>Подготовьте сообщение и выберите аудиторию.</p></div><button id="sendBroadcast" class="primary-action" type="button">Отправить</button></header><div id="broadcastStatus" class="status" hidden></div><section class="broadcast-grid"><div class="composer"><article class="panel"><div class="panel-head"><div><span class="step">01</span><h2>Аудитория</h2></div><span id="recipientBadge" class="badge">0 получателей</span></div><div id="segments" class="segments"><label><input type="radio" name="segment" value="all" checked><span><b>Все клиенты</b><small id="allCount">0 человек</small></span></label><label><input type="radio" name="segment" value="active"><span><b>Активные</b><small id="activeCount">покупали за 30 дней</small></span></label><label><input type="radio" name="segment" value="no_purchases"><span><b>Без покупок</b><small id="noPurchasesCount">ещё не покупали</small></span></label><label><input type="radio" name="segment" value="custom"><span><b>Выбрать вручную</b></span></label></div><div id="customAudience" class="custom-audience" hidden><input id="customerSearch" placeholder="Найти клиента"><div id="customerList" class="customer-list"></div></div></article><article class="panel"><div class="panel-head"><div><span class="step">02</span><h2>Сообщение</h2></div><span id="charCount" class="badge">0 / 3500</span></div><div class="toolbar"><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="underline"><u>U</u></button><button type="button" data-command="strikeThrough"><s>S</s></button><button type="button" id="addLink">↗ Ссылка</button><button type="button" data-command="removeFormat">Очистить</button></div><div id="editor" class="editor" contenteditable="true"></div><div class="media-row"><label class="upload-button">＋ Добавить изображение<input id="broadcastImage" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="removeImage" class="text-button" type="button" hidden>Удалить</button></div><div class="button-fields"><label>Текст кнопки<input id="buttonText"></label><label>Ссылка кнопки<input id="buttonUrl" type="url"></label></div></article></div><aside class="preview-column"><article class="panel preview-panel"><div class="panel-head"><h2>Предпросмотр</h2></div><div class="telegram-preview"><div class="message-bubble"><img id="previewImage" hidden alt=""><div id="previewText">Ваше сообщение появится здесь.</div><a id="previewButton" hidden></a></div></div></article><article class="panel"><div class="panel-head"><h2>Последние отправки</h2></div><div id="history" class="history"></div></article></aside></section></main></div><script src="/broadcast-default-link.js?v=3"></script><script src="/broadcasts.js?v=3&status=2"></script><script src="/broadcast-edit-fix-v2.js?v=1"></script></body></html>
