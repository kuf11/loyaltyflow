<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"> <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0b0d10"><title>Вход кассира — LoyaltyFlow</title><link rel="stylesheet" href="/cashier.css?v=1"><link rel="stylesheet" href="/cashier-access.css?v=2"></head><body><main class="login-shell"><section class="login-card"><div class="login-logo">LF</div><div class="eyebrow" style="margin-top:18px">Рабочее место</div><h1>Вход кассира</h1><p class="muted">Используйте общую ссылку кассы и свои личные логин и пароль.</p><form id="loginForm"><label>Логин<input id="login" autocomplete="username" maxlength="80" placeholder="ivan@company" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" maxlength="72" required></label><div class="captcha-wrap"><span class="captcha-label">Проверка безопасности</span><div id="cashier-turnstile" class="cf-turnstile"></div><input id="turnstileToken" type="hidden"><div id="captchaStatus" class="captcha-status">Загрузка проверки…</div></div><button id="loginButton" class="btn primary" type="submit" disabled>Войти в кассу</button><div id="status" class="login-status" aria-live="polite"></div></form></section></main><script src="/cashier-login.js?v=3" defer></script></body></html>
