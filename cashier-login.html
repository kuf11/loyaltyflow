<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Вход кассира — LoyaltyFlow</title><link rel="stylesheet" href="/cashier.css?v=1"><link rel="stylesheet" href="/cashier-access.css?v=1"></head><body><main class="login-shell"><section class="login-card"><div class="login-logo">LF</div><div class="eyebrow" style="margin-top:18px">Рабочее место</div><h1>Вход кассира</h1><p class="muted">Используйте логин и пароль, выданные владельцем программы.</p><form id="loginForm"><label>Логин<input id="login" autocomplete="username" maxlength="64" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" maxlength="72" required></label><button class="btn primary" type="submit">Войти в кассу</button><div id="status" class="login-status" aria-live="polite"></div></form></section></main><script src="/cashier-login.js?v=1" defer></script></body></html>
