<!doctype html><html lang="ru"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0b0d10"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Кассиры — LoyaltyFlow</title><link rel="stylesheet" href="/cashier.css?v=1"><link rel="stylesheet" href="/cashier-access.css?v=10"><link rel="stylesheet" href="/cashiers-fix.css?v=1"><link rel="stylesheet" href="/cashier-management.css?v=1"><link rel="stylesheet" href="/cashier-shared-link.css?v=1"></head><body><main class="access-shell"><header class="top"><div><a href="/integrations">← Интеграции</a><div class="eyebrow">Доступ сотрудников</div><h1>Учётные записи кассиров</h1><div class="muted">Одна общая ссылка для входа, личные логин и пароль для каждого кассира.</div></div></header><div class="access-grid"><section class="card"><h2>Новый кассир</h2><form id="cashierForm" class="access-form"><label>ФИО<input id="fullName" maxlength="160" autocomplete="name" placeholder="Иванов Иван Иванович" required></label><label>Телефон<input id="phone" type="tel" inputmode="numeric" maxlength="15" autocomplete="tel" required></label><label>Почта<input id="email" type="email" maxlength="254" autocomplete="email" placeholder="cashier@company.ru" required></label><label>Логин<div class="login-compose"><input id="loginBase" minlength="3" maxlength="40" autocomplete="off" placeholder="ivan" required><span id="companySuffix" aria-live="polite">@…</span></div><small>Название компании добавляется автоматически.</small></label><label>Пароль<input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Например, Cashier9!" required><small id="passwordHelp">8–72 символа: латинская строчная и заглавная буквы, цифра и один из символов # @ ! $ % & * ?</small></label><button class="btn primary" type="submit">Создать кассира</button></form><div id="formStatus" class="status" aria-live="polite"></div><p class="secure">Пароль хранится только в виде стойкого хеша. После сброса пароля все открытые сессии этого кассира завершаются.</p></section><section class="card"><div class="customer-head"><div><div class="eyebrow">Сотрудники</div><h2>Кассиры</h2></div><button id="refresh" class="btn" type="button">Обновить</button></div><div id="cashierList" class="cashier-list"><p class="muted">Загружаем…</p></div></section></div></main><script src="/cashiers.js?v=11" defer></script><script src="/cashier-password-reset.js?v=2" defer></script><script src="/cashier-shared-link-ui.js?v=1" defer></script></body></html>
