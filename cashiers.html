<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Кассиры — LoyaltyFlow</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.2.3/dist/css/intlTelInput.min.css"><link rel="stylesheet" href="/cashier.css?v=1"><link rel="stylesheet" href="/cashier-access.css?v=2"></head><body><main class="access-shell"><header class="top"><div><a href="/integrations.html">← Интеграции</a><div class="eyebrow">Доступ сотрудников</div><h1>Учётные записи кассиров</h1><div class="muted">Отдельный доступ без передачи учётной записи владельца.</div></div></header><div class="access-grid"><section class="card"><h2>Новый кассир</h2><form id="cashierForm" class="access-form"><label>ФИО<input id="fullName" maxlength="160" autocomplete="name" placeholder="Иванов Иван Иванович" required></label><label>Телефон<input id="phone" type="tel" inputmode="tel" maxlength="40" autocomplete="tel" required></label><label>Почта<input id="email" type="email" maxlength="254" autocomplete="email" placeholder="cashier@company.ru" required></label><label>Логин<div class="login-compose"><input id="loginBase" minlength="3" maxlength="40" autocomplete="off" placeholder="ivan" required><span id="companySuffix">@company</span></div><small>Название компании добавляется автоматически.</small></label><label>Пароль<input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Не менее 8 символов" required><small>8–72 символа: строчная и заглавная буквы, цифра и спецсимвол # @ ! $ % & * ?</small></label><button class="btn primary" type="submit">Создать и сгенерировать ссылку</button></form><div id="formStatus" class="status" aria-live="polite"></div><p class="secure">Пароль хранится только в виде стойкого хеша. Передайте кассиру ссылку, полный логин и пароль безопасным способом.</p></section><section class="card"><div class="customer-head"><div><div class="eyebrow">Сотрудники</div><h2>Кассиры</h2></div><button id="refresh" class="btn" type="button">Обновить</button></div><div id="cashierList" class="cashier-list"><p class="muted">Загружаем…</p></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.2.3/dist/js/intlTelInput.min.js"></script><script src="/cashiers.js?v=2" defer></script></body></html>
