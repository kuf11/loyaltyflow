<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Ассортимент — LoyaltyFlow</title><link rel="stylesheet" href="/admin.css?v=1"><style>.catalog-shell{max-width:1180px;margin:auto;padding:0 28px 48px}.catalog-top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20242b;margin-bottom:30px}.back{color:#9299a5;text-decoration:none}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #20242b}.product-row img,.product-placeholder{width:64px;height:64px;border-radius:10px;background:#20252c}.product-row img{object-fit:cover}.product-placeholder{display:grid;place-items:center;color:#9299a5}.product-row .meta{color:#9299a5;font-size:13px}.status{min-height:22px;margin-top:12px;color:#70d7a5}.file-btn{position:relative;overflow:hidden;white-space:nowrap}.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}@media(max-width:760px){.catalog-shell{padding:0 16px 32px}.catalog-top{height:64px}.form-grid{grid-template-columns:1fr}.product-row{grid-template-columns:52px 1fr}.product-row img,.product-placeholder{width:52px;height:52px}.product-row .actions{grid-column:1/-1}.hero-row .actions{width:100%}.hero-row .actions .btn{flex:1}}</style></head><body><main class="catalog-shell"><header class="catalog-top"><div class="brand" style="padding:0"><span class="brand-mark">L</span>LoyaltyFlow</div><a class="back" href="/">← В кабинет</a></header><div class="hero-row"><div><div class="eyebrow">Ассортимент</div><h1>Каталог товаров</h1><p>Товары, цены и бонусы в вашем Mini App.</p></div><div class="actions"><label class="btn file-btn"><span>Импортировать CSV</span><input id="csv" type="file" accept=".csv,text/csv"></label><button type="button" class="btn" id="downloadTemplate">Скачать шаблон</button><button type="button" class="btn primary" id="saveCatalog">Сохранить каталог</button></div></div><form id="productForm" class="card form-section"><div class="section-title"><div><h2>Новый товар</h2><p>Заполните данные и добавьте позицию в список.</p></div></div><div class="form-grid"><label class="field">Название<input id="productName" required></label><label class="field">Категория<input id="category"></label><label class="field">Цена, ₽<input id="price" type="number" min="0"></label><label class="field">Бонусы<input id="bonus" type="number" min="0"></label><label class="field">Остаток<input id="stock" type="number" min="0" value="1"></label><label class="field">URL изображения<input id="image" type="url"></label></div><div class="actions" style="margin-top:16px"><button type="submit" class="btn primary">Добавить товар</button></div><div id="status" class="status" aria-live="polite"></div></form><section class="card"><div class="section-title"><div><h2>Товары <span id="count"></span></h2><p>Изменения попадут в Mini App после сохранения.</p></div></div><div id="list"></div></section></main><script src="/catalog-admin.js?v=2" defer></script></body></html>
