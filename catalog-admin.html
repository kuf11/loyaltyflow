<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Ассортимент — LoyaltyFlow</title><link rel="stylesheet" href="/admin.css?v=1"><style>.catalog-shell{max-width:1180px;margin:auto;padding:0 28px 48px}.catalog-top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20242b;margin-bottom:30px}.back{color:#9299a5;text-decoration:none}.hero-row .actions .btn{display:inline-flex;align-items:center;justify-content:center;line-height:1.2}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form-grid .full{grid-column:1/-1}.form-grid textarea{width:100%;min-height:110px;resize:vertical}.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #20242b}.product-row img,.product-placeholder{width:64px;height:64px;border-radius:10px;background:#20252c}.product-row img{object-fit:cover}.product-placeholder{display:grid;place-items:center}.status{min-height:22px;margin-top:12px;color:#70d7a5}.modal-open{overflow:hidden}.excel-modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:#050709cc;backdrop-filter:blur(8px)}.excel-modal[hidden]{display:none}.excel-dialog{width:min(920px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#14181d;border:1px solid #303740;border-radius:18px;box-shadow:0 28px 90px #0009}.excel-head,.excel-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px}.excel-head{border-bottom:1px solid #282e36}.excel-head h2{margin:0}.excel-head p{margin:4px 0 0;color:#9299a5}.icon-button{width:40px;height:40px;border:1px solid #303740;border-radius:10px;background:#1b2026;font-size:22px}.excel-body{padding:22px}.import-drop{display:grid;place-items:center;min-height:280px;padding:30px;border:1px dashed #4d5a65;border-radius:14px;background:#101419;text-align:center}.import-drop strong{font-size:20px}.import-drop p{max-width:520px;color:#9299a5}.import-drop small{margin-top:14px;color:#707985}.import-result{display:grid;gap:16px}.import-summary{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border:1px solid #315441;border-radius:12px;background:#14251d}.import-summary span{color:#9dd9bc}.import-preview{overflow:auto;border:1px solid #293039;border-radius:12px}.import-preview table{width:100%;border-collapse:collapse}.import-preview th,.import-preview td{padding:11px 12px;border-bottom:1px solid #272e36;text-align:left;white-space:nowrap}.import-preview th{background:#1b2026;color:#aeb6c0;font-size:12px}.import-preview small{display:block;padding:12px;color:#9299a5}.import-error{padding:14px;border:1px solid #663536;border-radius:10px;background:#2b1718;color:#ffb7b7}.excel-foot{border-top:1px solid #282e36;justify-content:flex-end}@media(max-width:760px){.catalog-shell{padding:0 16px 32px}.form-grid{grid-template-columns:1fr}.product-row{grid-template-columns:52px 1fr}.product-row .actions{grid-column:1/-1}.hero-row .actions{display:grid;grid-template-columns:1fr 1fr}.hero-row .actions .btn.primary{grid-column:1/-1}.excel-modal{padding:10px}.excel-head,.excel-body,.excel-foot{padding:16px}.import-summary{display:grid}}</style></head><body><main class="catalog-shell"><header class="catalog-top"><a class="brand" style="padding:0;color:inherit;text-decoration:none" href="/" onclick="location.assign('/');return false"><span class="brand-mark">L</span>LoyaltyFlow</a><a class="back" href="/">← В кабинет</a></header><div class="hero-row"><div><div class="eyebrow">Ассортимент</div><h1>Каталог товаров</h1><p>Товары, цены, бонусы и остатки в вашем Mini App.</p></div><div class="actions"><button type="button" class="btn" id="importExcel">Импорт Excel</button><button type="button" class="btn" id="exportExcel">Экспорт Excel</button><button type="button" class="btn" id="downloadTemplate">Скачать шаблон</button><button type="button" class="btn primary" id="saveCatalog">Сохранить каталог</button></div></div><form id="productForm" class="card form-section"><div class="section-title"><div><h2>Новый товар</h2></div></div><div class="form-grid"><label class="field">Название<input id="productName" required></label><label class="field">Категория<input id="category"></label><label class="field">Цена, ₽<input id="price" type="number" min="0"></label><label class="field">Бонусы<input id="bonus" type="number" min="0"></label><label class="field">Остаток<input id="stock" type="number" min="0" value="1"></label><label class="field">URL изображения<input id="image" type="url"></label><label class="field full">Описание товара<textarea id="description" maxlength="2000" placeholder="Характеристики, особенности и другая полезная информация"></textarea></label></div><div class="actions" style="margin-top:16px"><button type="submit" class="btn primary">Добавить товар</button></div><div id="status" class="status"></div></form><section class="card"><div class="section-title"><h2>Товары <span id="count"></span></h2></div><div id="list"></div></section></main><div id="excelModal" class="excel-modal" hidden><section class="excel-dialog" role="dialog" aria-modal="true" aria-labelledby="excelTitle"><header class="excel-head"><div><h2 id="excelTitle">Импорт товаров из Excel</h2><p>Проверим структуру и покажем данные до добавления.</p></div><button id="closeImport" class="icon-button" type="button" aria-label="Закрыть">×</button></header><div class="excel-body"><label id="importDrop" class="import-drop"><strong>Выберите Excel-файл</strong><p>Поддерживаются XLSX и XLS. Первая строка должна содержать названия столбцов.</p><span class="btn primary">Загрузить файл</span><small>До 10 МБ и 2000 строк</small><input id="excelFile" type="file" accept=".xlsx,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden></label><div id="importResult" class="import-result" hidden><div id="importSummary" class="import-summary"></div><div id="importPreview" class="import-preview"></div></div></div><footer class="excel-foot"><button id="cancelImport" type="button" class="btn">Отменить</button><button id="applyImport" type="button" class="btn primary" hidden>Импортировать</button></footer></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script><script src="/catalog-admin.js?v=4" defer></script><script src="/catalog-home-fix.js?v=1" defer></script></body></html>
