<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ассортимент — LoyaltyFlow</title><style>:root{--g:#102c28;--a:#22a77a;--b:#dfe7e4;--m:#71807c}*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#172321;font:14px/1.45 Arial,sans-serif}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--b);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px;margin:10px 0}.field input{padding:10px;border:1px solid var(--b);border-radius:8px}.btn{border:1px solid var(--b);background:#fff;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--a);color:#fff;border-color:var(--a)}.product{display:grid;grid-template-columns:70px 1fr auto;gap:14px;align-items:center;border-top:1px solid var(--b);padding:14px 0}.product img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#eef2f1}.muted{color:var(--m)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-weight:700;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.product{grid-template-columns:55px 1fr}.product .actions{grid-column:1/-1}}</style></head><body><header><b>LoyaltyFlow · Ассортимент</b><a href="/">← В кабинет</a></header><main><div class="card"><h1>Каталог товаров</h1><p class="muted">Добавляйте товары вручную или импортируйте CSV. Изменения сохраняются в вашем Mini App.</p><div class="grid"><label class="field">Название<input id="name"></label><label class="field">Категория<input id="category"></label><label class="field">Цена, ₽<input id="price" type="number" min="0"></label><label class="field">Бонусов за покупку<input id="bonus" type="number" min="0"></label><label class="field">Остаток<input id="stock" type="number" min="0" value="1"></label><label class="field">URL изображения<input id="image" type="url"></label></div><div class="actions"><button class="btn primary" onclick="add()">Добавить товар</button><label class="btn">Импорт CSV<input id="csv" type="file" accept=".csv,text/csv" hidden onchange="importCsv(this)"></label><button class="btn" onclick="downloadTemplate()">Шаблон CSV</button><button class="btn primary" onclick="save()">Сохранить каталог</button></div><div id="status" class="status"></div></div><div class="card"><h2>Товары <span id="count"></span></h2><div id="list"></div></div></main><script>const token=localStorage.getItem('LF_TOKEN');if(!token)location='/auth.html';let data,products=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка');return x};function render(){count.textContent='('+products.length+')';list.innerHTML=products.length?products.map((p,i)=>'<div class="product"><img src="'+esc(p.image||'')+'" onerror="this.style.visibility=\'hidden\'"><div><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.category||'Без категории')+' · '+Number(p.price||0).toLocaleString('ru-RU')+' ₽ · +'+Number(p.bonus||0)+' бонусов · остаток '+Number(p.stock||0)+'</span></div><div class="actions"><button class="btn" onclick="edit('+i+')">Изменить</button><button class="btn" onclick="del('+i+')">Удалить</button></div></div>').join(''):'<p class="muted">Каталог пока пуст.</p>'}function form(){return{name:name.value.trim(),category:category.value.trim(),price:+price.value||0,bonus:+bonus.value||0,stock:+stock.value||0,image:image.value.trim()}}function clearForm(){for(let x of [name,category,price,bonus,image])x.value='';stock.value=1}function add(){let p=form();if(!p.name)return alert('Введите название');products.push({...p,id:crypto.randomUUID()});clearForm();render()}function edit(i){let p=products[i];name.value=p.name;category.value=p.category;price.value=p.price;bonus.value=p.bonus;stock.value=p.stock;image.value=p.image||'';products.splice(i,1);render();scrollTo({top:0,behavior:'smooth'})}function del(i){products.splice(i,1);render()}function parse(line,sep){return line.split(new RegExp(sep+'(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)')).map(x=>x.trim().replace(/^\"|\"$/g,''))}function importCsv(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let lines=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),sep=lines[0].includes(';')?';':',',head=parse(lines.shift(),sep).map(x=>x.toLowerCase());for(let line of lines){let row=parse(line,sep),get=k=>row[head.indexOf(k)]||'';if(get('name')||get('название'))products.push({id:crypto.randomUUID(),name:get('name')||get('название'),category:get('category')||get('категория'),price:+(get('price')||get('цена'))||0,bonus:+(get('bonus')||get('бонусы'))||0,stock:+(get('stock')||get('остаток'))||0,image:get('image')||get('изображение')})}render();status.textContent='CSV импортирован. Нажмите «Сохранить каталог».'};r.readAsText(f)}function downloadTemplate(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['name,category,price,bonus,stock,image\n'],{type:'text/csv'}));a.download='loyaltyflow-products.csv';a.click()}async function save(){status.textContent='Сохраняем…';try{let design={...data.design,products,catalog:true};let x=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({design})});data.design=design;status.textContent='✓ Каталог сохранён в Mini App'}catch(e){status.textContent='Ошибка: '+e.message}}(async()=>{try{data=await api('/api/v1/owner/miniapp');products=Array.isArray(data.design.products)?data.design.products:[];render()}catch(e){status.textContent=e.message}})();</script></body></html>
