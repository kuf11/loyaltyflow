<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Ассортимент — LoyaltyFlow</title><link rel="stylesheet" href="/admin.css?v=1"><style>.catalog-shell{max-width:1180px;margin:auto;padding:0 28px 48px}.catalog-top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20242b;margin-bottom:30px}.back{color:#9299a5;text-decoration:none}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #20242b}.product-row img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#20252c}.product-row .meta{color:#9299a5;font-size:13px}.status{min-height:22px;margin-top:12px;color:#70d7a5}.file-btn input{display:none}@media(max-width:760px){.catalog-shell{padding:0 16px 32px}.form-grid{grid-template-columns:1fr}.product-row{grid-template-columns:52px 1fr}.product-row img{width:52px;height:52px}.product-row .actions{grid-column:1/-1}}</style></head><body><main class="catalog-shell"><header class="catalog-top"><div class="brand" style="padding:0"><span class="brand-mark">L</span>LoyaltyFlow</div><a class="back" href="/">← Вернуться в кабинет</a></header><div class="hero-row"><div><div class="eyebrow">Ассортимент</div><h1>Каталог товаров</h1><p>Товары, цены и бонусы в вашем Mini App.</p></div><div class="actions"><label class="btn file-btn">Импорт CSV<input id="csv" type="file" accept=".csv,text/csv" onchange="importCsv(this)"></label><button class="btn" onclick="downloadTemplate()">Шаблон CSV</button><button class="btn primary" onclick="save()">Сохранить</button></div></div><section class="card form-section"><div class="section-title"><div><h2>Новый товар</h2><p>Заполните данные и добавьте позицию в список.</p></div></div><div class="form-grid"><label class="field">Название<input id="name"></label><label class="field">Категория<input id="category"></label><label class="field">Цена, ₽<input id="price" type="number" min="0"></label><label class="field">Бонусы<input id="bonus" type="number" min="0"></label><label class="field">Остаток<input id="stock" type="number" min="0" value="1"></label><label class="field">URL изображения<input id="image" type="url"></label></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="add()">Добавить товар</button></div><div id="status" class="status"></div></section><section class="card"><div class="section-title"><div><h2>Товары <span id="count"></span></h2><p>Изменения попадут в Mini App после сохранения.</p></div></div><div id="list"></div></section></main><script>const token=localStorage.getItem('LF_TOKEN');if(!token)location='/auth.html';let data,products=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.error||'Ошибка');return x};function render(){count.textContent='('+products.length+')';list.innerHTML=products.length?products.map((p,i)=>'<div class="product-row"><img src="'+esc(p.image||'')+'" onerror="this.style.visibility=\'hidden\'"><div><b>'+esc(p.name)+'</b><div class="meta">'+esc(p.category||'Без категории')+' · '+Number(p.price||0).toLocaleString('ru-RU')+' ₽ · +'+Number(p.bonus||0)+' бонусов · '+Number(p.stock||0)+' шт.</div></div><div class="actions"><button class="btn" onclick="edit('+i+')">Изменить</button><button class="btn" onclick="del('+i+')">Удалить</button></div></div>').join(''):'<div class="empty-block"><div><b>Каталог пуст</b><span>Добавьте первый товар или импортируйте CSV.</span></div></div>'}function form(){return{name:name.value.trim(),category:category.value.trim(),price:+price.value||0,bonus:+bonus.value||0,stock:+stock.value||0,image:image.value.trim()}}function clearForm(){for(let x of [name,category,price,bonus,image])x.value='';stock.value=1}function add(){let p=form();if(!p.name)return alert('Введите название');products.push({...p,id:crypto.randomUUID()});clearForm();render()}function edit(i){let p=products[i];name.value=p.name;category.value=p.category;price.value=p.price;bonus.value=p.bonus;stock.value=p.stock;image.value=p.image||'';products.splice(i,1);render();scrollTo({top:0,behavior:'smooth'})}function del(i){products.splice(i,1);render()}function parse(line,sep){return line.split(new RegExp(sep+'(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)')).map(x=>x.trim().replace(/^\"|\"$/g,''))}function importCsv(input){let f=input.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let lines=String(r.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),sep=lines[0].includes(';')?';':',',head=parse(lines.shift(),sep).map(x=>x.toLowerCase());for(let line of lines){let row=parse(line,sep),get=k=>row[head.indexOf(k)]||'';if(get('name')||get('название'))products.push({id:crypto.randomUUID(),name:get('name')||get('название'),category:get('category')||get('категория'),price:+(get('price')||get('цена'))||0,bonus:+(get('bonus')||get('бонусы'))||0,stock:+(get('stock')||get('остаток'))||0,image:get('image')||get('изображение')})}render();status.textContent='CSV импортирован. Сохраните каталог.'};r.readAsText(f)}function downloadTemplate(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['name,category,price,bonus,stock,image\n'],{type:'text/csv'}));a.download='loyaltyflow-products.csv';a.click()}async function save(){status.textContent='Сохраняем…';try{let design={...data.design,products,catalog:true};await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({design})});data.design=design;status.textContent='Каталог сохранён в Mini App'}catch(e){status.textContent='Ошибка: '+e.message}}(async()=>{try{data=await api('/api/v1/owner/miniapp');products=Array.isArray(data.design.products)?data.design.products:[];render()}catch(e){status.textContent=e.message}})();</script></body></html>
