services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loyaltyflow
      POSTGRES_USER: loyaltyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyaltyflow -d loyaltyflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://loyaltyflow:${POSTGRES_PASSWORD}@db:5432/loyaltyflow
      BUSINESS_SLUG: ${BUSINESS_SLUG:-main}
      SYNC_SECRET: ${SYNC_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_KEY: ${ADMIN_KEY}
      JWT_SECRET: ${JWT_SECRET}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ALLOW_DEV_CAPTCHA: ${ALLOW_DEV_CAPTCHA:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALLOW_DEV_EMAIL_CODE: ${ALLOW_DEV_EMAIL_CODE:-false}
      AUTO_APPROVE_REGISTRATIONS: ${AUTO_APPROVE_REGISTRATIONS:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
  bot-menu-sync:
    build: ./api
    restart: unless-stopped
    command: ["node","bot-menu-sync.js"]
    environment:
      DATABASE_URL: postgresql://loyaltyflow:${POSTGRES_PASSWORD}@db:5432/loyaltyflow
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      BOT_MENU_SYNC_INTERVAL_MS: ${BOT_MENU_SYNC_INTERVAL_MS:-900000}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
volumes:
  postgres_data:
