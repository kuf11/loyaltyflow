<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoyaltyFlow — кабинет</title><style>:root{--g:#102c28;--a:#22a77a;--bg:#f3f6f5;--b:#dfe7e4;--m:#71807c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172321;font:15px/1.45 Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:var(--g);color:#fff;padding:22px 15px}.logo{font-size:20px;font-weight:800;margin:0 10px 28px}.logo b{display:inline-grid;place-items:center;width:35px;height:35px;background:var(--a);border-radius:11px;margin-right:10px}.nav button{display:block;width:100%;border:0;background:none;color:#b8cec8;text-align:left;padding:13px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#183b35;color:#fff}.account{position:fixed;bottom:20px;width:210px;color:#b8cec8;font-size:13px}main{padding:28px 30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:28px}.muted{color:var(--m)}.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #102c280d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;background:#fff}.field input[type=color]{height:46px;padding:4px}.field input[type=range]{padding:0;border:0}.checks label{display:flex;gap:8px;margin:9px 0}.btn{border:1px solid var(--b);background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--a);border-color:var(--a);color:#fff}.danger{color:#b33}.notice{padding:12px;border-radius:9px;background:#eef7f4;margin:12px 0}.status{font-weight:700;margin-top:12px}.phone{border:8px solid #172724;border-radius:36px;overflow:hidden;min-height:680px;box-shadow:0 24px 55px #102c2830}.island{width:116px;height:29px;background:#07110f;border-radius:0 0 18px 18px;margin:auto}.phone-head{padding:12px 18px 19px;color:#fff}.phone-body{padding:14px}.phone-card{padding:16px;margin-bottom:11px}.balance{color:#fff}.balance b{display:block;font-size:34px;margin:8px 0}.glass{backdrop-filter:blur(18px);background:#ffffffb8!important}.kpi b{display:block;font-size:27px;margin-top:10px}.pill{padding:6px 10px;border-radius:99px;background:#e7f7f1;color:#157556;font-weight:700}.hidden{display:none}@media(max-width:1000px){.two{grid-template-columns:1fr}.phone{max-width:390px;margin:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.app{display:block}aside{position:relative}.account{display:none}main{padding:18px 14px}.grid,.row{grid-template-columns:1fr}}</style></head><body><div id="root"><main>Загрузка…</main></div><script>
const token=localStorage.getItem('LF_TOKEN');if(!token)location.replace('/auth.html');
const api=async(url,options={})=>{options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,options),x=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('LF_TOKEN');location.replace('/auth.html');throw Error('Войдите снова')}if(!r.ok)throw Error(x.error||'Ошибка');return x};
const D={name:'Моя программа',accent:'#22a77a',header:'#102c28',background:'#eef2f1',card:'#ffffff',text:'#172321',font:'Arial, sans-serif',fontSize:15,titleSize:24,radius:18,spacing:14,glass:true,shadow:true,logo:'',title:'Добро пожаловать!',description:'Получайте вознаграждения за покупки.',qr:true,offers:true,history:true,profile:true,balanceLabel:'Ваш баланс',buttonText:'Показать QR-код'};
let user={},state={design:{...D},connected:false,botUsername:'',appUrl:''},page='Обзор';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=['Обзор','Вознаграждения','Mini App','Клиенты','Настройки'];function shell(body){return '<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+pages.map(x=>'<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="account">'+esc(user.company||'')+'<br><button class="btn" style="margin-top:8px" onclick="logout()">Выйти</button></div></aside><main>'+body+'</main></div>'}function go(x){page=x;render()}function logout(){localStorage.removeItem('LF_TOKEN');location='/auth.html'}
function overview(){return '<div class="head"><div><h1>Обзор</h1><span class="muted">'+esc(user.company||'')+'</span></div><span class="pill">'+(user.status==='trial'?'Пробный период':'Активен')+'</span></div><div class="grid">'+[['Выручка','0 ₽'],['Клиенты','0'],['Начислено','0 ₽'],['Покупки','0']].map(x=>'<div class="card kpi"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Запуск программы</h2><p>Перейдите в <b>Mini App</b>, вставьте токен от BotFather, настройте внешний вид и нажмите «Сохранить и подключить».</p></div>'}
function rewards(){return '<div class="head"><h1>Вознаграждения</h1></div><div class="card"><h2>Кешбэк и бонусы</h2><p class="muted">Настройка механики будет привязана к этому аккаунту на следующем этапе.</p><div class="row"><label class="field">Кешбэк, %<input type="number" value="5"></label><label class="field">Оплата бонусами до, %<input type="number" value="30"></label></div><button class="btn primary">Сохранить</button></div>'}
function mini(){const d=state.design;return '<div class="head"><div><h1>Настройка Mini App</h1><span class="muted">Конструктор в стиле UDS — настройте приложение без разработчика</span></div><span class="pill">'+(state.connected?'@'+esc(state.botUsername):'Бот не подключён')+'</span></div><div class="two"><form id="form" class="card" oninput="preview()" onsubmit="saveMini(event)"><h2>Telegram-бот</h2><label class="field">API-токен от BotFather<input name="botToken" type="password" autocomplete="new-password" placeholder="123456789:AA...#" value=""></label><div class="notice">'+(state.connected?'Бот уже подключён. Оставьте поле пустым, чтобы сохранить текущий токен.':'Токен проверяется через Telegram и хранится на сервере в зашифрованном виде.')+'</div><label class="field">Адрес Mini App<input value="'+esc(state.appUrl)+'" readonly></label><h2>Бренд</h2><label class="field">Название программы<input name="name" value="'+esc(d.name)+'"></label><label class="field">Логотип<input type="file" accept="image/*" onchange="logo(this)"></label><div class="row"><label class="field">Акцент<input name="accent" type="color" value="'+d.accent+'"></label><label class="field">Шапка<input name="header" type="color" value="'+d.header+'"></label><label class="field">Фон<input name="background" type="color" value="'+d.background+'"></label><label class="field">Карточки<input name="card" type="color" value="'+d.card+'"></label><label class="field">Текст<input name="text" type="color" value="'+d.text+'"></label><label class="field">Шрифт<select name="font"><option>Arial, sans-serif</option><option>Verdana, sans-serif</option><option>Georgia, serif</option><option>Trebuchet MS, sans-serif</option></select></label><label class="field">Размер текста<input name="fontSize" type="range" min="12" max="22" value="'+d.fontSize+'"></label><label class="field">Заголовки<input name="titleSize" type="range" min="18" max="36" value="'+d.titleSize+'"></label><label class="field">Скругления<input name="radius" type="range" min="0" max="32" value="'+d.radius+'"></label><label class="field">Отступы<input name="spacing" type="range" min="6" max="24" value="'+d.spacing+'"></label></div><h2>Главный экран</h2><label class="field">Приветствие<input name="title" value="'+esc(d.title)+'"></label><label class="field">Описание<textarea name="description">'+esc(d.description)+'</textarea></label><div class="row"><label class="field">Название баланса<input name="balanceLabel" value="'+esc(d.balanceLabel)+'"></label><label class="field">Текст кнопки<input name="buttonText" value="'+esc(d.buttonText)+'"></label></div><div class="checks"><label><input name="glass" type="checkbox" '+(d.glass?'checked':'')+'> Эффект стекла</label><label><input name="shadow" type="checkbox" '+(d.shadow?'checked':'')+'> Тени</label><label><input name="profile" type="checkbox" '+(d.profile?'checked':'')+'> Профиль клиента</label><label><input name="qr" type="checkbox" '+(d.qr?'checked':'')+'> QR-код</label><label><input name="offers" type="checkbox" '+(d.offers?'checked':'')+'> Предложения</label><label><input name="history" type="checkbox" '+(d.history?'checked':'')+'> История операций</label></div><button class="btn primary">Сохранить и подключить</button><div id="status" class="status"></div></form><div id="preview"></div></div>'}
function read(){const f=document.querySelector('#form'),x=new FormData(f);return{...state.design,name:x.get('name'),accent:x.get('accent'),header:x.get('header'),background:x.get('background'),card:x.get('card'),text:x.get('text'),font:x.get('font'),fontSize:+x.get('fontSize'),titleSize:+x.get('titleSize'),radius:+x.get('radius'),spacing:+x.get('spacing'),title:x.get('title'),description:x.get('description'),balanceLabel:x.get('balanceLabel'),buttonText:x.get('buttonText'),glass:!!x.get('glass'),shadow:!!x.get('shadow'),profile:!!x.get('profile'),qr:!!x.get('qr'),offers:!!x.get('offers'),history:!!x.get('history')}}
function preview(){if(!document.querySelector('#form'))return;const d=read(),shadow=d.shadow?'0 14px 35px #102c2825':'none',card='background:'+d.card+';border-radius:'+d.radius+'px;box-shadow:'+shadow,block=x=>'<div class="phone-card '+(d.glass?'glass':'')+'" style="'+card+'">'+x+'</div>';document.querySelector('#preview').innerHTML='<div class="phone" style="background:'+d.background+';font-family:'+d.font+';font-size:'+d.fontSize+'px;color:'+d.text+'"><div class="island"></div><div class="phone-head" style="background:'+d.header+'">'+(d.logo?'<img src="'+d.logo+'" style="width:32px;height:32px;border-radius:9px;vertical-align:middle;margin-right:8px;object-fit:cover">':'')+'<b>'+esc(d.name)+'</b></div><div class="phone-body" style="padding:'+d.spacing+'px"><div class="phone-card balance" style="background:'+d.accent+';border-radius:'+d.radius+'px;box-shadow:'+shadow+'"><strong style="font-size:'+d.titleSize+'px">'+esc(d.title)+'</strong><small style="display:block;margin-top:8px">'+esc(d.description)+'</small><span style="display:block;margin-top:18px">'+esc(d.balanceLabel)+'</span><b>0</b><button class="btn">'+esc(d.buttonText)+'</button></div>'+(d.profile?block('<b>Профиль клиента</b>'):'')+(d.offers?block('<b>Предложения</b><p>Здесь появятся акции</p>'):'')+(d.history?block('<b>История операций</b><p>Операций пока нет</p>'):'')+'</div></div>'}
function logo(input){const file=input.files[0];if(!file)return;if(file.size>500000)return alert('Файл должен быть меньше 500 КБ');const r=new FileReader;r.onload=()=>{state.design.logo=r.result;preview()};r.readAsDataURL(file)}
async function saveMini(e){e.preventDefault();const status=document.querySelector('#status');status.textContent='Проверяем бота и сохраняем…';try{const f=document.querySelector('#form'),result=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botToken:f.botToken.value,design:read()})});state={...state,...result,design:read()};f.botToken.value='';status.textContent='✓ '+result.message;setTimeout(render,900)}catch(error){status.textContent='Ошибка: '+error.message}}
function clients(){return '<div class="head"><h1>Клиенты</h1></div><div class="card">Клиенты появятся после запуска Mini App.</div>'}function settings(){return '<div class="head"><h1>Настройки</h1></div><div class="card"><h2>Подписка</h2><p>Тариф: <b>5 000 ₽/месяц</b></p><p>Тестовый период начинается после одобрения аккаунта.</p></div>'}
function render(){const map={'Обзор':overview,'Вознаграждения':rewards,'Mini App':mini,'Клиенты':clients,'Настройки':settings};root.innerHTML=shell(map[page]());if(page==='Mini App'){document.querySelector('#form').font.value=state.design.font;preview()}}
(async()=>{try{user=await api('/api/v1/auth/me');state=await api('/api/v1/owner/miniapp');render()}catch(error){root.innerHTML='<main>'+esc(error.message)+'</main>'}})();
</script></body></html>
