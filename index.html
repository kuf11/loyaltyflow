const token=localStorage.getItem('LF_TOKEN');if(!token)location.replace('/auth.html');const api=async(url,options={})=>{options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,options),x=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('LF_TOKEN');location.replace('/auth.html');throw Error('Войдите снова')}if(!r.ok)throw Error(x.error||'Ошибка');return x};const D={name:'Моя программа',accent:'#22a77a',header:'#102c28',background:'#eef2f1',card:'#ffffff',text:'#172321',font:'Inter, sans-serif',fontSize:15,titleSize:24,radius:18,spacing:14,glass:true,shadow:true,logo:'',title:'Добро пожаловать!',description:'Получайте вознаграждения за покупки.',qr:true,offers:true,history:true,profile:true,balanceLabel:'Ваш баланс',buttonText:'Показать QR-код'};const fonts=[['Inter','Inter, sans-serif'],['Manrope','Manrope, sans-serif'],['Montserrat','Montserrat, sans-serif'],['Roboto','Roboto, sans-serif'],['Open Sans','Open Sans, sans-serif'],['Lato','Lato, sans-serif'],['Nunito Sans','Nunito Sans, sans-serif'],['Rubik','Rubik, sans-serif'],['Poppins','Poppins, sans-serif'],['Raleway','Raleway, sans-serif'],['Ubuntu','Ubuntu, sans-serif'],['PT Sans','PT Sans, sans-serif'],['Fira Sans','Fira Sans, sans-serif'],['IBM Plex Sans','IBM Plex Sans, sans-serif'],['Source Sans 3','Source Sans 3, sans-serif'],['Comfortaa','Comfortaa, cursive'],['Exo 2','Exo 2, sans-serif'],['Oswald','Oswald, sans-serif'],['Playfair Display','Playfair Display, serif'],['Merriweather','Merriweather, serif'],['Arial','Arial, sans-serif'],['Verdana','Verdana, sans-serif'],['Georgia','Georgia, serif'],['Trebuchet','Trebuchet MS, sans-serif']];let user={},state={design:{...D},connected:false,botUsername:'',appUrl:''},page='Обзор';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fontOptions=current=>fonts.map(([n,v])=>'<option value="'+v+'" '+(v===current?'selected':'')+'>'+n+'</option>').join(''),pages=['Обзор','Вознаграждения','Mini App','Клиенты','Настройки'];
function shell(body){return '<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+pages.map(x=>'<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="account">'+esc(user.company||'')+'<br><button class="btn" style="margin-top:8px" onclick="logout()">Выйти</button></div></aside><main>'+body+'</main></div>'}function go(x){page=x;render()}function logout(){localStorage.removeItem('LF_TOKEN');location='/auth.html'}function overview(){return '<div class="head"><div><h1>Обзор</h1><span class="muted">'+esc(user.company||'')+'</span></div><span class="pill">'+(user.status==='trial'?'Пробный период':'Активен')+'</span></div><div class="grid">'+[['Выручка','0 ₽'],['Клиенты','0'],['Начислено','0 ₽'],['Покупки','0']].map(x=>'<div class="card kpi"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Запуск программы</h2><p>Настройте Mini App и подключите Telegram-бота.</p></div>'}function rewards(){return '<div class="head"><h1>Вознаграждения</h1></div><div class="card"><h2>Кешбэк и бонусы</h2><div class="row"><label class="field">Кешбэк, %<input type="number" value="5"></label><label class="field">Оплата бонусами до, %<input type="number" value="30"></label></div><button class="btn primary">Сохранить</button></div>'}
function mini(){const d=state.design;return '<div class="head"><div><h1>Настройка Mini App</h1><span class="muted">Все изменения отображаются сразу</span></div><span class="pill">'+(state.connected?'@'+esc(state.botUsername):'Бот не подключён')+'</span></div><div class="studio"><form id="form" class="card editor" oninput="renderPreview()" onsubmit="saveMini(event)"><h2>Telegram-бот</h2><label class="field">API-токен от BotFather<input name="botToken" type="password" autocomplete="new-password" placeholder="123456789:AA..."></label><div class="notice">'+(state.connected?'Бот подключён. Оставьте поле пустым, чтобы не менять токен.':'Токен проверяется Telegram и хранится на сервере зашифрованным.')+'</div><label class="field">Адрес Mini App<input value="'+esc(state.appUrl)+'" readonly></label><h2>Бренд и стиль</h2><label class="field">Название программы<input name="name" value="'+esc(d.name)+'"></label><label class="field">Логотип<input type="file" accept="image/*" onchange="logo(this)"></label><div class="row"><label class="field">Акцент<input name="accent" type="color" value="'+d.accent+'"></label><label class="field">Шапка<input name="header" type="color" value="'+d.header+'"></label><label class="field">Фон<input name="background" type="color" value="'+d.background+'"></label><label class="field">Карточки<input name="card" type="color" value="'+d.card+'"></label><label class="field">Текст<input name="text" type="color" value="'+d.text+'"></label><label class="field">Шрифт<select name="font">'+fontOptions(d.font)+'</select></label><label class="field">Размер текста <output id="fsOut">'+d.fontSize+' px</output><input name="fontSize" type="range" min="11" max="24" value="'+d.fontSize+'"></label><label class="field">Заголовки <output id="titleOut">'+d.titleSize+' px</output><input name="titleSize" type="range" min="18" max="40" value="'+d.titleSize+'"></label><label class="field">Скругления <output id="radiusOut">'+d.radius+' px</output><input name="radius" type="range sc(d.title)+'</strong><small style="display:block;margin-top:6px">'+esc(d.description)+'</small><span style="display:block;margin-top:14px">'+esc(d.balanceLabel)+'</span><b>0</b><button class="btn">'+esc(d.buttonText)+'</button></div>'+(d.profile?block('<b>Профиль клиента</b>'):'')+(d.qr?block('<b>Мой QR-код</b><p>Покажите код при покупке</p>'):'')+(d.offers?block('<b>Предложения</b><p>Здесь появятся акции</p>'):'')+(d.history?block('<b>История операций</b><p>Операций пока нет</p>'):'')+'</div><div class="homebar"></div></div></div></div>'}function tiltPhone(e){const el=document.querySelector('#phone3d');if(!el)return;const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform='rotateY('+(x*15)+'deg) rotateX('+(-y*8)+'deg)'}function resetPhone(){const el=document.querySelector('#phone3d');if(el)el.style.transform='rotateY(-9deg) rotateX(2deg)'}function logo(input){const file=input.files[0];if(!file)return;if(file.size>500000)return alert('Файл должен быть меньше 500 КБ');const r=new FileReader;r.onload=()=>{state.design.logo=r.result;renderPreview()};r.readAsDataURL(file)}async function saveMini(e){e.preventDefault();const st=document.querySelector('#saveStatus');st.textContent='Проверяем бота и сохраняем…';try{const f=document.querySelector('#form'),design=read(),result=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botToken:f.botToken.value,design})});state={...state,...result,design};f.botToken.value='';st.textContent='✓ '+result.message}catch(error){st.textContent='Ошибка: '+error.message}}function clients(){return '<div class="head"><h1>Клиенты</h1></div><div class="card">Клиенты появятся после запуска Mini App.</div>'}function settings(){return '<div class="head"><h1>Настройки</h1></div><div class="card"><h2>Подписка</h2><p>Тариф: <b>5 000 ₽/месяц</b></p></div>'}function render(){const map={'Обзор':overview,'Вознаграждения':
