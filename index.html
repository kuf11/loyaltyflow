<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoyaltyFlow</title><style>:root{--bg:#070a12;--side:#11131d;--card:#181b25;--card2:#202431;--line:#2b3040;--text:#f6f7fb;--muted:#8d94a6;--accent:#22a77a;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Arial,sans-serif}button,input,textarea{font:inherit}.app{min-height:100vh;padding-left:270px}.sidebar{position:fixed;inset:0 auto 0 0;width:270px;background:var(--side);border:1px solid #252837;border-radius:0 22px 22px 0;padding:25px 18px;z-index:20}.brand{font-size:21px;font-weight:800;margin:0 8px 31px}.brand b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:13px;margin-right:10px;background:linear-gradient(135deg,var(--accent),#5ee3b5);color:#07120f}.nav small{display:block;color:#5d6475;margin:24px 12px 8px;text-transform:uppercase;font-size:10px;letter-spacing:.1em}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#8f96a7;padding:12px 13px;border-radius:9px;text-align:left;cursor:pointer}.nav button:hover,.nav button.on{background:#343746;color:#fff}.nav i{font-style:normal;width:20px;text-align:center}.account{position:absolute;bottom:20px;left:20px;right:20px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted)}main{padding:22px 28px}.topbar{height:64px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.topbar h1{font-size:24px;margin:0}.userpill{background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:99px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi b{display:block;font-size:26px;margin-top:9px}.workspace{display:grid;grid-template-columns:minmax(420px,1fr) 410px;gap:22px;height:calc(100vh - 98px)}.editor{overflow:auto;padding-right:4px}.section{margin-bottom:14px}.section h2{font-size:16px;margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:#fff;outline:none}.field input:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{min-height:78px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#17382d;color:#8ee4c4;margin:12px 0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:9px;align-items:center;padding:11px;background:var(--card2);border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(90deg,var(--accent),#37cc98)}.secondary{background:linear-gradient(90deg,#4f1a8b,var(--purple));border:0}.status{font-weight:700;margin-top:12px}.previewbox{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#293044,#11131d 58%,#090b11);display:grid;place-items:center}.phone{width:320px;height:650px;background:#07090d;border:7px solid #3c424d;border-radius:47px;overflow:hidden;box-shadow:-14px 20px 35px #0009,7px 5px 0 #181b22;position:relative;font-family:Arial,sans-serif}.island{position:absolute;z-index:4;top:11px;left:50%;transform:translateX(-50%);width:105px;height:28px;background:#020304;border-radius:17px}.phead{padding:51px 17px 17px;background:#101820;display:flex;align-items:center;gap:8px}.logo{width:30px;height:30px;border-radius:9px;object-fit:cover}.pbody{height:calc(100% - 82px);overflow:auto;padding:12px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:9px}.pcard{background:#1d2731;border-radius:18px;padding:13px;margin-bottom:10px}.balance strong{display:block;font-size:31px;margin:12px 0}.qr{background:#1684ff;text-align:center}.qrsim{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:#fff;padding:7px;width:105px;height:105px;margin:8px auto;border-radius:10px}.qrsim i{background:#07111b}.promo{background:linear-gradient(145deg,#1684ff,#6657ff);min-height:120px}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:8px}.product{height:95px;border-radius:15px;background:#202936;padding:10px}.bottom{position:absolute;left:9px;right:9px;bottom:9px;border:1px solid #ffffff14;border-radius:18px;padding:10px;background:#171d25ed;display:flex;justify-content:space-around;color:#aeb7c0}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#17382d;color:#8ee4c4;font-weight:700}.link{color:#70e5ba;text-decoration:none}@media(max-width:1100px){.workspace{grid-template-columns:1fr;height:auto}.previewbox{height:730px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.app{padding-left:0;padding-top:230px}.sidebar{width:100%;height:230px;border-radius:0}.account{display:none}main{padding:14px}.grid,.checks{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>const token=localStorage.getItem('LF_TOKEN');if(!token)location.replace('/auth.html');const api=async(url,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(url,o),x=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('LF_TOKEN');location='/auth.html'}if(!r.ok)throw Error(x.error||'Ошибка');return x};let user={},state={design:{},connected:false,botUsername:'',appUrl:''},page='Обзор';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pages=[['Обзор','◫'],['Вознаграждения','◉'],['Mini App','◈'],['Ассортимент','▤'],['Клиенты','♙'],['Настройки','⚙']];function shell(body){return '<div class="app"><aside class="sidebar"><div class="brand"><b>L</b>LoyaltyFlow</div><nav class="nav"><small>Управление</small>'+pages.map(([x,i])=>'<button class="'+(x===page?'on':'')+'" onclick="go(\''+x+'\')"><i>'+i+'</i>'+x+'</button>').join('')+'</nav><div class="account">'+esc(user.company||'')+'<br><button class="btn" onclick="logout()" style="margin-top:10px">Выйти</button></div></aside><main>'+body+'</main></div>'}function go(x){if(x==='Ассортимент')return location='/catalog-admin.html';page=x;render()}function logout(){localStorage.removeItem('LF_TOKEN');location='/auth.html'}function top(title,sub=''){return '<div class="topbar"><div><h1>'+title+'</h1><span class="muted">'+sub+'</span></div><div class="userpill">'+esc(user.name||'')+'</div></div>'}function overview(){return top('Обзор',user.company||'')+'<div class="grid">'+[['Выручка','0 ₽'],['Клиенты','0'],['Бонусы','0'],['Заказы','0']].map(x=>'<div class="card kpi"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card" style="margin-top:14px"><h2>Запуск LoyaltyFlow</h2><p class="muted">Подключите Telegram-бота, заполните главный экран и добавьте ассортимент.</p><button class="btn primary" onclick="go(\'Mini App\')">Настроить Mini App</button></div>'}function rewards(){return top('Вознаграждения')+'<div class="card"><h2>Кешбэк и бонусы</h2><div class="grid" style="grid-template-columns:1fr 1fr"><label class="field">Кешбэк, %<input type="number" value="5"></label><label class="field">Оплата бонусами до, %<input type="number" value="30"></label></div><button class="btn primary">Сохранить</button></div>'}
function mini(){let d=state.design||{};return top('Mini App','Простая настройка без технических адресов')+'<div class="workspace"><div class="editor"><form id="form" oninput="preview()" onsubmit="saveMini(event)"><section class="card section"><h2>Подключение Telegram</h2><label class="field">API-токен Telegram-бота<input name="botToken" type="password" autocomplete="new-password" placeholder="Вставьте токен от BotFather"></label><div class="notice">'+(state.connected?'Подключён бот @'+esc(state.botUsername)+'. Оставьте поле пустым, чтобы не менять токен.':'После сохранения бот проверится и Mini App подключится автоматически.')+'</div></section><section class="card section"><h2>Компания</h2><label class="field">Название компании<input name="name" value="'+esc(d.name||user.company||'')+'"></label><label class="field">Логотип<input type="file" accept="image/*" onchange="logoFile(this)"></label><span class="hint">PNG или JPG, до 500 КБ</span></section><section class="card section"><h2>Главный экран</h2><label class="field">Заголовок<input name="title" value="'+esc(d.title||'Добро пожаловать!')+'"></label><label class="field">Описание<textarea name="description">'+esc(d.description||'Получайте бонусы за покупки.')+'</textarea></label><label class="field">Название баланса<input name="balanceLabel" value="'+esc(d.balanceLabel||'Ваш баланс')+'"></label><label class="field">Текст кнопки QR<input name="buttonText" value="'+esc(d.buttonText||'Показать QR-код')+'"></label><div class="checks"><label class="check"><input name="qr" type="checkbox" '+(d.qr!==false?'checked':'')+'> QR-код</label><label class="check"><input name="profile" type="checkbox" '+(d.profile!==false?'checked':'')+'> Профиль</label><label class="check"><input name="offers" type="checkbox" '+(d.offers!==false?'checked':'')+'> Предложения</label><label class="check"><input name="history" type="checkbox" '+(d.history!==false?'checked':'')+'> История</label><label class="check"><input name="catalog" type="checkbox" '+(d.catalog!==false?'checked':'')+'> Каталог</label></div></section><div class="actions"><button class="btn primary">Сохранить и подключить</button><button type="button" class="btn secondary" onclick="location=\'/catalog-admin.html\'">Настроить ассортимент</button></div><div id="saveStatus" class="status"></div></form></div><div class="card previewbox"><div id="phonePreview"></div></div></div>'}function read(){let f=document.querySelector('#form'),x=new FormData(f);return{...state.design,name:x.get('name'),title:x.get('title'),description:x.get('description'),balanceLabel:x.get('balanceLabel'),buttonText:x.get('buttonText'),qr:!!x.get('qr'),profile:!!x.get('profile'),offers:!!x.get('offers'),history:!!x.get('history'),catalog:!!x.get('catalog'),accent:'#1684ff',header:'#101820',background:'#07090d',card:'#1d2731',text:'#f7f9fb',font:'Arial, sans-serif',fontSize:15,titleSize:25,radius:20,spacing:14,glass:false,shadow:true}}
function preview(){let target=document.querySelector('#phonePreview');if(!target)return;let d=read(),dots=Array.from({length:49},(_,i)=>'<i style="opacity:'+(i%3===0||i%5===0||i<8||i>40?1:0)+'"></i>').join('');target.innerHTML='<div class="phone"><div class="island"></div><div class="phead">'+(d.logo?'<img class="logo" src="'+d.logo+'">':'<div class="logo" style="background:#5eead4"></div>')+'<b>'+esc(d.name)+'</b></div><div class="pbody"><div class="hero"><div class="pcard balance"><span>'+esc(d.balanceLabel)+'</span><strong>0</strong><small>Получайте бонусы за покупки</small></div>'+(d.qr?'<div class="pcard qr"><b>Мой QR</b><div class="qrsim">'+dots+'</div></div>':'')+'</div><div class="pcard promo"><h2>'+esc(d.title)+'</h2><p>'+esc(d.description)+'</p></div>'+(d.catalog?'<h2>Каталог</h2><div class="catalog"><div class="product"><b>Товары</b></div><div class="product"><b>Категории</b></div></div>':'')+'</div><div class="bottom"><span>⌂</span><span>▦</span><span>▤</span><span>🛒</span></div></div>'}function logoFile(i){let f=i.files[0];if(!f)return;if(f.size>500000)return alert('Файл больше 500 КБ');let r=new FileReader;r.onload=()=>{state.design.logo=r.result;preview()};r.readAsDataURL(f)}async function saveMini(e){e.preventDefault();let st=document.querySelector('#saveStatus');st.textContent='Сохраняем…';try{let f=e.target,design=read(),x=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botToken:f.botToken.value,design})});state={...state,...x,design};f.botToken.value='';st.textContent='✓ '+x.message}catch(e){st.textContent='Ошибка: '+e.message}}
function clients(){return top('Клиенты')+'<div class="card"><p class="muted">Клиенты появятся после запуска программы.</p></div>'}function settings(){return top('Настройки')+'<div class="card"><h2>Подписка</h2><p>Тариф: <b>5 000 ₽/месяц</b></p><span class="pill">'+(user.status==='trial'?'Пробный период':'Активна')+'</span></div>'}function render(){let map={'Обзор':overview,'Вознаграждения':rewards,'Mini App':mini,'Клиенты':clients,'Настройки':settings};root.innerHTML=shell(map[page]());if(page==='Mini App')preview()}(async()=>{try{user=await api('/api/v1/auth/me');state=await api('/api/v1/owner/miniapp');render()}catch(e){root.innerHTML='<main>'+esc(e.message)+'</main>'}})();</script></body></html>
