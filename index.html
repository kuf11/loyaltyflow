<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoyaltyFlow</title><style>*{box-sizing:border-box}:root{--bg:#080b13;--side:#11131d;--card:#191c28;--soft:#242836;--line:#303546;--text:#f7f8fc;--muted:#9299aa;--a:#22a77a}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}.app{padding-left:260px;min-height:100vh}aside{position:fixed;inset:0 auto 0 0;width:260px;background:var(--side);border-right:1px solid var(--line);padding:24px 16px}.brand{font-size:21px;font-weight:800;margin:0 10px 28px}.brand b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),#69e7b7);color:#07120f;margin-right:10px}.nav button{width:100%;display:block;border:0;background:none;color:var(--muted);padding:12px 14px;text-align:left;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#353949;color:#fff}main{padding:22px 28px}.top{display:flex;justify-content:space-between;align-items:center;height:58px;margin-bottom:14px}.top h1{margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px}.studio{display:grid;grid-template-columns:minmax(420px,1fr) 390px;gap:20px;height:calc(100vh - 94px)}.editor{overflow:auto}.section{margin-bottom:13px}.field{display:grid;gap:6px;margin:11px 0}.field input,.field textarea{padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:#fff}.field textarea{min-height:76px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks label{padding:10px;background:var(--soft);border-radius:9px}.notice{padding:11px;background:#17382d;color:#90e7c6;border-radius:9px}.btn{border:1px solid var(--line);background:var(--soft);color:#fff;padding:11px 14px;border-radius:9px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(90deg,#168b65,#2bc991)}.purple{border:0;background:linear-gradient(90deg,#5b21b6,#8b5cf6)}.actions{display:flex;gap:9px}.preview{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#30374a,#10131c 62%);overflow:hidden}.phone{width:300px;height:620px;border:7px solid #444b57;border-radius:44px;background:#07090d;overflow:hidden;position:relative;box-shadow:-14px 20px 35px #000b}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:98px;height:27px;border-radius:16px;background:#020304;z-index:4}.ph{padding:49px 16px 15px;background:#111923;display:flex;gap:9px;align-items:center}.logo{width:29px;height:29px;border-radius:9px;background:#5eead4;object-fit:cover}.pb{padding:11px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc{padding:12px;border-radius:17px;background:#1d2731;margin-bottom:9px}.bal strong{display:block;font-size:28px;margin:9px 0}.qr{background:#1684ff;text-align:center}.qrpic{width:80px;height:80px;margin:7px auto;border:7px solid #fff;border-radius:8px;background:repeating-conic-gradient(#08111b 0 25%,#fff 0 50%) 0/13px 13px}.promo{min-height:112px;background:linear-gradient(145deg,#1684ff,#6657ff)}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prod{height:75px;padding:9px;border-radius:13px;background:#202936}.bottom{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-around;padding:10px;border-radius:17px;background:#171d25ed;border:1px solid #ffffff18}.error{padding:13px;border-radius:9px;background:#421a22;color:#ffb4c0;margin:10px 0}@media(max-width:1000px){.studio{grid-template-columns:1fr;height:auto}.preview{height:690px}}@media(max-width:700px){.app{padding-left:0;padding-top:215px}aside{width:100%;height:215px}main{padding:14px}.checks{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script>const root=document.getElementById('root'),token=localStorage.getItem('LF_TOKEN');if(!token)location.replace('/auth.html');let user={name:'',company:''},state={design:{},connected:false,botUsername:''},page='Обзор';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};let r=await fetch(u,o),x=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('LF_TOKEN');location='/auth.html'}if(!r.ok)throw Error(x.error||'Ошибка сервера');return x}const nav=['Обзор','Вознаграждения','Mini App','Ассортимент','Клиенты','Настройки'];function shell(body){root.innerHTML='<div class="app"><aside><div class="brand"><b>L</b>LoyaltyFlow</div><div class="nav">'+nav.map(x=>'<button class="'+(x===page?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div></aside><main>'+body+'</main></div>'}function go(x){if(x==='Ассортимент')return location='/catalog-admin.html';page=x;render()}function top(t){return '<div class="top"><h1>'+t+'</h1><span>'+esc(user.name)+'</span></div>'}function simple(t){return top(t)+'<div class="card">Раздел готовится к подключению данных.</div>'}function mini(){let d=state.design||{};return top('Mini App')+'<div class="studio"><form id="form" class="editor" oninput="draw()" onsubmit="save(event)"><div class="card section"><h2>Telegram</h2><label class="field">API-токен бота<input name="botToken" type="password" placeholder="Токен от BotFather"></label><div class="notice">'+(state.connected?'Подключён @'+esc(state.botUsername):'Бот подключится автоматически после сохранения')+'</div></div><div class="card section"><h2>Компания</h2><label class="field">Название<input name="name" value="'+esc(d.name||user.company)+'"></label><label class="field">Логотип<input id="logo" type="file" accept="image/*"></label></div><div class="card section"><h2>Главный экран</h2><label class="field">Заголовок<input name="title" value="'+esc(d.title||'Добро пожаловать!')+'"></label><label class="field">Описание<textarea name="description">'+esc(d.description||'Получайте бонусы за покупки.')+'</textarea></label><label class="field">Название баланса<input name="balanceLabel" value="'+esc(d.balanceLabel||'Ваш баланс')+'"></label><label class="field">Текст кнопки<input name="buttonText" value="'+esc(d.buttonText||'Показать QR-код')+'"></label><div class="checks"><label><input name="qr" type="checkbox" '+(d.qr!==false?'checked':'')+'> QR</label><label><input name="profile" type="checkbox" '+(d.profile!==false?'checked':'')+'> Профиль</label><label><input name="offers" type="checkbox" '+(d.offers!==false?'checked':'')+'> Акции</label><label><input name="history" type="checkbox" '+(d.history!==false?'checked':'')+'> История</label><label><input name="catalog" type="checkbox" '+(d.catalog!==false?'checked':'')+'> Каталог</label></div></div><div class="actions"><button class="btn primary">Сохранить</button><button type="button" class="btn purple" onclick="location=\'/catalog-admin.html\'">Ассортимент</button></div><div id="status"></div></form><div class="card preview"><div id="phone"></div></div></div>'}function read(){let f=document.getElementById('form'),x=new FormData(f);return{...state.design,name:x.get('name'),title:x.get('title'),description:x.get('description'),balanceLabel:x.get('balanceLabel'),buttonText:x.get('buttonText'),qr:!!x.get('qr'),profile:!!x.get('profile'),offers:!!x.get('offers'),history:!!x.get('history'),catalog:!!x.get('catalog'),accent:'#1684ff',header:'#111923',background:'#07090d',card:'#1d2731',text:'#f7f9fb',font:'Arial, sans-serif',fontSize:15,titleSize:25,radius:20,spacing:14}}function draw(){let p=document.getElementById('phone');if(!p)return;let d=read();p.innerHTML='<div class="phone"><div class="island"></div><div class="ph">'+(d.logo?'<img class="logo" src="'+d.logo+'">':'<div class="logo"></div>')+'<b>'+esc(d.name)+'</b></div><div class="pb"><div class="hero"><div class="pc bal">'+esc(d.balanceLabel)+'<strong>0</strong><small>Бонусы за покупки</small></div>'+(d.qr?'<div class="pc qr"><b>Мой QR</b><div class="qrpic"></div></div>':'')+'</div><div class="pc promo"><h2>'+esc(d.title)+'</h2><p>'+esc(d.description)+'</p></div>'+(d.catalog?'<h2>Каталог</h2><div class="catalog"><div class="prod">Товары</div><div class="prod">Категории</div></div>':'')+'</div><div class="bottom"><span>⌂</span><span>▦</span><span>▤</span><span>🛒</span></div></div>'}async function save(e){e.preventDefault();let st=document.getElementById('status'),f=e.target,design=read();st.textContent='Сохраняем…';try{let x=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botToken:f.botToken.value,design})});state={...state,...x,design};f.botToken.value='';st.textContent='✓ '+x.message}catch(x){st.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}function render(){let body=page==='Mini App'?mini():simple(page);shell(body);if(page==='Mini App'){draw();document.getElementById('logo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{state.design.logo=r.result;draw()};r.readAsDataURL(f)}}}render();Promise.all([api('/api/v1/auth/me'),api('/api/v1/owner/miniapp')]).then(x=>{user=x[0];state=x[1];render()}).catch(e=>shell('<div class="error">'+esc(e.message)+'</div>'));</script></body></html>
