const token=localStorage.getItem('LF_TOKEN');if(!token)location.replace('/auth.html');const api=async(url,options={})=>{options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,options),x=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('LF_TOKEN');location.replace('/auth.html');throw Error('Войдите снова')}if(!r.ok)throw Error(x.error||'Ошибка');return x};
const D={name:'Моя программа',accent:'#22a77a',header:'#102c28',background:'#eef2f1',card:'#ffffff',text:'#172321',font:'Inter, sans-serif',fontSize:15,titleSize:24,radius:18,spacing:14,glass:true,shadow:true,logo:'',title:'Добро пожаловать!',description:'Получайте вознаграждения за покупки.',qr:true,offers:true,history:true,profile:true,balanceLabel:'Ваш баланс',buttonText:'Показать QR-код'};

let user={},state={design:{...D},connected:false,botUsername:'',appUrl:''},page='Обзор';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fontOptions=current=>fonts.map(([n,v])=>'<option value="'+v+'" '+(v===current?'selected':'')+' style="font-family:'+v+'">'+n+'</option>').join('');const pages=['Обзор','Вознаграждения','Mini App','Клиенты','Настройки'];
function shell(body){return '<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+pages.map(x=>'<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="account">'+esc(user.company||'')+'<br><button class="btn" style="margin-top:8px" onclick="logout()">Выйти</button></div></aside><main>'+body+'</main></div>'}function go(x){page=x;render()}function logout(){localStorage.removeItem('LF_TOKEN');location='/auth.html'}
function overview(){return '<div class="head"><div><h1>Обзор</h1><span class="muted">'+esc(user.company||'')+'</span></div><span class="pill">'+(user.status==='trial'?'Пробный период':'Активен')+'</span></div><div class="grid">'+[['Выручка','0 ₽'],['Клиенты','0'],['Начислено','0 ₽'],['Покупки','0']].map(x=>'<div class="card kpi"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Запуск программы</h2><p>Откройте Mini App, настройте оформление на интерактивной 3D-модели и подключите Telegram-бота.</p></div>'}
function rewards(){return '<div class="head"><h1>Вознаграждения</h1></div><div class="card"><h2>Кешбэк и бонусы</h2><div class="row"><label class="field">Кешбэк, %<input type="number" value="5"></label><label class="field">Оплата бонусами до, %<input type="number" value="30"></label></div><button class="btn primary">Сохранить</button></div>'}
function mini(){const d=state.design;return '<div class="head"><div><h1>Настройка Mini App</h1><span class="muted">Правки мгновенно отображаются на 3D-модели</span></div><span class="pill">'+(state.connected?'@'+esc(state.botUsername):'Бот не подключён')+'</span></div><div class="two"><form id="form" class="card" oninput="preview()" onsubmit="saveMini(event)"><h2>Telegram-бот</h2><label class="field">API-токен от BotFather<input name="botToken" type="password" autocomplete="new-password" placeholder="123456789:AA..."></label><div class="notice">'+(state.connected?'Бот подключён. Оставьте поле пустым, чтобы не менять токен.':'Токен проверяется Telegram и хранится на сервере зашифрованным.')+'</div><label class="field">Адрес Mini App<input value="'+esc(state.appUrl)+'" readonly></label><h2>Бренд и стиль</h2><label class="field">Название программы<input name="name" value="'+esc(d.name)+'"></label><label class="field">Логотип<input type="file" accept="image/*" onchange="logo(this)"></label><div class="row"><label class="field">Акцент<input name="accent" type="color" value="'+d.accent+'"></label><label class="field">Шапка<input name="header" type="color" value="'+d.header+'"></label><label class="field">Фон<input name="background" type="color" value="'+d.background+'"></label><label class="field">Карточки<input name="card" type="color" value="'+d.card+'"></label><label class="field">Текст<input name="text" type="color" value="'+d.text+'"></label><label class="field">Шрифт<select name="font">'+fontOptions(d.font)+'</select></label><label class="field">Размер текста: <output id="fsOut">'+d.fontSize+' px</output><input name="fontSize" type="range" min="11" max="24" value="'+d.fontSize+'"></label><label class="field">Заголовки: <output id="titleOut">'+d.titleSize+' px</output><input name="titleSize" type="range" min="18" max="40" value="'+d.titleSize+'"></label><label class="field">Скругления: <output id="radiusOut">'+d.radius+' px</output><input name="radius" type="range" min="0" max="36" value="'+d.radius+'"></label><label class="field">Отступы: <output id="spaceOut">'+d.spacing+' px</output><input name="spacing" type="range" min="6" max="28" value="'+d.spacing+'"></label></div><h2>Главный экран</h2><label class="field">Приветствие<input name="title" value="'+esc(d.title)+'"></label><label class="field">Описание<textarea name="description">'+esc(d.description)+'</textarea></label><div class="row"><label class="field">Название баланса<input name="balanceLabel" value="'+esc(d.balanceLabel)+'"></label><label class="field">Текст кнопки<input name="buttonText" value="'+esc(d.buttonText)+'"></label></div><div class="checks"><label><input name="glass" type="checkbox" '+(d.glass?'checked':'')+'> Эффект стекла</label><label><input name="shadow" type="checkbox" '+(d.shadow?'checked':'')+'> Объёмные тени</label><label><input name="profile" type="checkbox" '+(d.profile?'checked':'')+'> Профиль клиента</label><label><input name="qr" type="checkbox" '+(d.qr?'checked':'')+'> QR-код</label><label><input name="offers" type="checkbox" '+(d.offers?'checked':'')+'> Предложения</label><label><input name="history" type="checkbox" '+(d.history?'checked':'')+'> История операций</label></div><button class="btn primary">Сохранить и подключить</button><div id="status" class="status"></div></form><div class="device-stage" onmousemove="tilt(event)" onmouseleave="untilt()"><div class="device-label">iPhone 18 Pro · 3D Concept</div><div id="preview"></div><div class="device-hint">Двигайте курсор — модель поворачивается</div></div></div>'}
function read(){const f=document.querySelector('#form'),x=new FormData(f);return{...state.design,name:x.get('name'),accent:x.get('accent'),header:x.get('header'),background:x.get('background'),card:x.get('card'),text:x.get('text'),font:x.get('font'),fontSize:+x.get('fontSize'),titleSize:+x.get('titleSize'),radius:+x.get('radius'),spacing:+x.get('spacing'),title:x.get('title'),description:x.get('description'),balanceLabel:x.get('balanceLabel'),buttonText:x.get('buttonText'),glass:!!x.get('glass'),shadow:!!x.get('shadow'),profile:!!x.get('profile'),qr:!!x.get('qr'),offers:!!x.get('offers'),history:!!x.get('history')}}
function preview(){if(!document.querySelector('#form'))return;const d=read();fsOut.textContent=d.fontSize+' px';titleOut.textContent=d.titleSize+' px';radiusOut.textContent=d.radius+' px';spaceOut.textContent=d.spacing+' px';const shadow=d.shadow?'0 14px 35px #102c2825':'none',card='background:'+d.card+';border-radius:'+d.radius+'px;box-shadow:'+shadow,block=x=>'<div class="phone-card '+(d.glass?'glass':'')+'" style="'+card+'">'+x+'</div>';preview.innerHTML='<div class="iphone-wrap" id="iphone"><div class="iphone-frame"><div class="phone" style="background:'+d.background+';font-family:'+d.font+';font-size:'+d.fontSize+'px;color:'+d.text+'"><div class="screen-glow"></div><div class="statusbar"><span>9:41</span><span>5G&nbsp; ◉</span></div><div class="island"></div><div class="phone-head" style="background:'+d.header+'">'+(d.logo?'<img src="'+d.logo+'" style="width:32px;height:32px;border-radius:9px;vertical-align:middle;margin-right:8px;object-fit:cover">':'')+'<b>'+esc(d.name)+'</b></div><div class="phone-body" style="padding:'+d.spacing+'px"><div class="phone-card balance" style="background:'+d.accent+';border-radius:'+d.radius+'px;box-shadow:'+shadow+'"><strong style="font-size:'+d.titleSize+'px">'+esc(d.title)+'</strong><small style="display:block;margin-top:8px">'+esc(d.description)+'</small><span style="display:block;margin-top:18px">'+esc(d.balanceLabel)+'</span><b>0</b><button class="btn">'+esc(d.buttonText)+'</button></div>'+(d.profile?block('<b>Профиль клиента</b>'):'')+(d.qr?block('<b>Мой QR-код</b><p>Покажите код при покупке</p>'):'')+(d.offers?block('<b>Предложения</b><p>Здесь появятся акции</p>'):'')+(d.history?block('<b>История операций</b><p>Операций пока нет</p>'):'')+'</div><div class="homebar"></div></div></div></div>'}
function tilt(e){const el=document.querySelector('#iphone');if(!el)return;const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform='rotateY('+(x*18)+'deg) rotateX('+(-y*10)+'deg)'}function untilt(){const el=document.querySelector('#iphone');if(el)el.style.transform='rotateY(-12deg) rotateX(4deg)'}
function logo(input){const file=input.files[0];if(!file)return;if(file.size>500000)return alert('Файл должен быть меньше 500 КБ');const r=new FileReader;r.onload=()=>{state.design.logo=r.result;preview()};r.readAsDataURL(file)}async function saveMini(e){e.preventDefault();const st=document.querySelector('#status');st.textContent='Проверяем бота и сохраняем…';try{const f=document.querySelector('#form'),design=read(),result=await api('/api/v1/owner/miniapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botToken:f.botToken.value,design})});state={...state,...result,design};f.botToken.value='';st.textContent='✓ '+result.message;setTimeout(render,900)}catch(error){st.textContent='Ошибка: '+error.message}}
function clients(){return '<div class="head"><h1>Клиенты</h1></div><div class="card">Клиенты появятся после запуска Mini App.</div>'}function settings(){return '<div class="head"><h1>Настройки</h1></div><div class="card"><h2>Подписка</h2><p>Тариф: <b>5 000 ₽/месяц</b></p><p>Тестовый период начинается после одобрения аккаунта.</p></div>'}function render(){const map={'Обзор':overview,'Вознаграждения':rewards,'Mini App':mini,'Клиенты':clients,'Настройки':settings};root.innerHTML=shell(map[page]());if(page==='Mini App')preview()}(async()=>{try{user=await api('/api/v1/auth/me');state=await api('/api/v1/owner/miniapp');render()}catch(error){root.innerHTML='<main>'+esc(error.message)+'</main>'}})();
</script></body></html>
