<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoyaltyFlow</title><style>:root{--g:#102c28;--a:#22a77a;--bg:#f3f6f5;--b:#dfe7e4;--m:#71807c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172321;font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:var(--g);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;margin:0 10px 28px}.logo b{display:inline-grid;place-items:center;width:34px;height:34px;background:var(--a);border-radius:10px;margin-right:10px}.nav button{display:block;width:100%;border:0;background:none;color:#b8cec8;text-align:left;padding:13px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#183b35;color:#fff}.plan{position:absolute;bottom:20px;left:15px;right:15px;border:1px solid #315049;border-radius:10px;padding:14px}.plan small{display:block;color:#9bb8b1;margin-top:5px}main{padding:28px 30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0 0 5px;font-size:28px}.muted{color:var(--m)}.btn{border:1px solid var(--b);background:white;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--a);border-color:var(--a);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #102c280d}.kpi span{font-size:13px;color:var(--m)}.kpi b{display:block;font-size:26px;margin:12px 0}.up{color:#16845f;background:#e1f6ee;padding:4px 7px;border-radius:6px;font-size:11px}.cols{display:grid;grid-template-columns:1.6fr .8fr;gap:16px}.chart{height:230px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--b);padding:20px 4px}.bar{flex:1;background:var(--a);border-radius:5px 5px 0 0}.offer{border:1px solid var(--b);padding:12px;border-radius:9px;margin-top:10px}.offer header{display:flex;justify-content:space-between}.offer small{color:var(--m)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-top:1px solid var(--b)}th{font-size:11px;color:var(--m)}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar input{max-width:260px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--b);border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.phone{max-width:330px;margin:auto;border:8px solid #1b2a27;border-radius:27px;overflow:hidden;background:#eef2f1;min-height:500px}.phone h3{margin:0;padding:18px;background:var(--g);color:#fff}.phone div{margin:14px;padding:18px;background:#fff;border-radius:13px}.phone .balance{background:var(--a);color:#fff}.phone .balance b{display:block;font-size:28px;margin-top:8px}.modal{position:fixed;inset:0;background:#102c2877;display:grid;place-items:center;padding:15px}.modal form{width:min(480px,100%);background:#fff;border-radius:13px;padding:22px}.modal h2{margin-top:0}.hide{display:none}.toast{position:fixed;right:20px;bottom:20px;background:var(--g);color:#fff;padding:12px 16px;border-radius:8px}.mobile{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}aside{display:none}main{padding:18px 15px 80px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.head h1{font-size:23px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--b);justify-content:space-around;padding:8px}.mobile button{border:0;background:none;color:var(--m);font-size:11px;padding:8px}}</style></head><body><div id="root"></div><div id="modal"></div><div id="toast"></div><script>const D={clients:[['Анна Крылова','+7 912 440-18-20',1240,18320],['Максим Серов','+7 922 118-31-44',560,11450],['Елена Волкова','+7 999 201-77-12',2380,29600]],ops:[['Анна Крылова','Покупка',3290,247],['Максим Серов','Списание',1450,-500],['Елена Волкова','Покупка',5600,420]],offers:[['Двойной кешбэк','15% по будням до 16:00',1],['Приведи друга','По 300 ₽ обоим',1]],cash:7.5,company:'LoyaltyFlow Demo',mini:'Мой кешбэк'};let s=JSON.parse(localStorage.LoyaltyFlow||'null')||D,p='Обзор';const pages=['Обзор','Клиенты','Операции','Кешбэк','Акции','Telegram Mini App','Аналитика','Настройки'],save=()=>localStorage.LoyaltyFlow=JSON.stringify(s),money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽',T=x=>{toast.innerHTML='<div class="toast">'+x+'</div>';setTimeout(()=>toast.innerHTML='',1800)},nav=()=>pages.map(x=>'<button class="'+(p==x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join(''),shell=x=>'<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+nav()+'</div><div class="plan"><b>Business</b><small>2 884 из 5 000 клиентов</small></div></aside><main>'+x+'</main></div><div class="mobile">'+pages.slice(0,5).map(x=>'<button onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div>',head=(a,b,c='')=>'<div class="head"><div><h1>'+a+'</h1><span class="muted">'+b+'</span></div><div>'+c+'</div></div>',kpi=(a,b)=>'<div class="card kpi"><span>'+a+'</span><b>'+b+'</b><i class="up">+8,1%</i></div>';function go(x){p=x;render()}function table(){return '<div class="card"><div class="toolbar"><h2>Последние операции</h2><button class="btn" onclick="csv()">Экспорт CSV</button></div><table><tr><th>Клиент</th><th>Тип</th><th>Сумма</th><th>Кешбэк</th></tr>'+s.ops.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+money(x[2])+'</td><td style="color:'+(x[3]>=0?'#16845f':'#c94d48')+'">'+money(x[3])+'</td></tr>').join('')+'</table></div>'}function overview(){return head('Обзор программы','Главные показатели', '<button class="btn primary" onclick="op()">+ Операция</button>')+'<div class="grid">'+kpi('Выручка','543 360 ₽')+kpi('Активные клиенты','1 284')+kpi('Начислено кешбэка','38 532 ₽')+kpi('Повторные покупки','38,6%')+'</div><div class="cols"><div class="card"><h2>Выручка и активность</h2><div class="chart">'+[42,55,48,67,58,76,71,88,82,96].map(x=>'<i class="bar" style="height:'+x+'%"></i>').join('')+'</div></div><div class="card"><h2>Активные акции</h2>'+s.offers.map(x=>'<div class="offer"><header><b>'+x[0]+'</b><span class="up">'+(x[2]?'Активна':'Пауза')+'</span></header><small>'+x[1]+'</small></div>').join('')+'</div></div>'+table()}function clients(){return head('Клиенты','Участники программы','<button class="btn primary" onclick="client()">+ Клиент</button>')+'<div class="card"><table><tr><th>Имя</th><th>Телефон</th><th>Баланс</th><th>Покупки</th></tr>'+s.clients.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+money(x[2])+'</td><td>'+money(x[3])+'</td></tr>').join('')+'</table></div>'}function operations(){return head('Операции','Начисления и списания','<button class="btn primary" onclick="op()">+ Операция</button>')+table()}function cashback(){return head('Кешбэк','Правила программы')+'<form class="card" onsubmit="event.preventDefault();s.cash=+this.rate.value;save();T(\'Сохранено\')"><div class="field"><label>Базовый кешбэк, %</label><input name="rate" type="number" min="0" max="100" step=".5" value="'+s.cash+'"></div><button class="btn primary">Сохранить</button></form>'}function offers(){return head('Акции','Предложения для клиентов','<button class="btn primary" onclick="offer()">+ Акция</button>')+'<div class="card">'+s.offers.map((x,i)=>'<div class="offer"><header><b>'+x[0]+'</b><button class="btn" onclick="s.offers['+i+'][2]=!s.offers['+i+'][2];save();render()">'+(x[2]?'Пауза':'Запустить')+'</button></header><small>'+x[1]+'</small></div>').join('')+'</div>'}function mini(){return head('Telegram Mini App','Настройка клиентского приложения')+'<div class="two"><form class="card" onsubmit="event.preventDefault();s.mini=this.title.value;save();render();T(\'Сохранено\')"><div class="field"><label>Название</label><input name="title" value="'+s.mini+'"></div><button class="btn primary">Сохранить</button></form><div class="phone"><h3>'+s.mini+'</h3><div class="balance">Ваш баланс<b>1 240 ₽</b></div><div><b>Показать QR-код</b><p class="muted">Для начисления и списания</p></div></div></div>'}function analytics(){return head('Аналитика','Экономика программы')+'<div class="grid">'+kpi('Средний чек','1 840 ₽')+kpi('LTV','16 780 ₽')+kpi('Конверсия акций','14,7%')+kpi('Повторные визиты','38,6%')+'</div>'}function settings(){return head('Настройки','Профиль компании')+'<form class="card" onsubmit="event.preventDefault();s.company=this.company.value;save();T(\'Настройки сохранены\')"><div class="field"><label>Название компании</label><input name="company" value="'+s.company+'"></div><button class="btn primary">Сохранить</button></form>'}function show(x){modal.innerHTML='<div class="modal" onclick="if(event.target==this)modal.innerHTML=\'\'"><form onsubmit="'+x.submit+'"><h2>'+x.title+'</h2>'+x.body+'<button class="btn primary">Сохранить</button> <button type="button" class="btn" onclick="modal.innerHTML=\'\'">Отмена</button></form></div>'}function client(){show({title:'Новый клиент',body:'<div class="field"><label>Имя</label><input name="name" required></div><div class="field"><label>Телефон</label><input name="phone" required></div>',submit:"event.preventDefault();s.clients.unshift([this.name.value,this.phone.value,300,0]);save();modal.innerHTML='';render();T('Клиент добавлен')"})}function op(){show({title:'Новая операция',body:'<div class="field"><label>Клиент</label><select name="who">'+s.clients.map(x=>'<option>'+x[0]+'</option>').join('')+'</select></div><div class="field"><label>Сумма</label><input name="sum" type="number" required></div>',submit:"event.preventDefault();let a=+this.sum.value;s.ops.unshift([this.who.value,'Покупка',a,Math.round(a*s.cash/100)]);save();modal.innerHTML='';render();T('Операция проведена')"})}function offer(){show({title:'Новая акция',body:'<div class="field"><label>Название</label><input name="name" required></div><div class="field"><label>Условия</label><textarea name="text" required></textarea></div>',submit:"event.preventDefault();s.offers.unshift([this.name.value,this.text.value,1]);save();modal.innerHTML='';render();T('Акция запущена')"})}function csv(){let c='Клиент;Тип;Сумма;Кешбэк\n'+s.ops.map(x=>x.join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+c]));a.download='loyaltyflow.csv';a.click();T('CSV скачан')}function render(){let f={'Обзор':overview,'Клиенты':clients,'Операции':operations,'Кешбэк':cashback,'Акции':offers,'Telegram Mini App':mini,'Аналитика':analytics,'Настройки':settings};root.innerHTML=shell(f[p]())}render()</script></body></html>
