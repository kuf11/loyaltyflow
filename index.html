<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="LoyaltyFlow — программа лояльности и конструктор Telegram Mini App"><title>LoyaltyFlow</title><style>:root{--g:#102c28;--a:#22a77a;--bg:#f3f6f5;--b:#dfe7e4;--m:#71807c;--r:#c94d48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172321;font:15px/1.45 Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}aside{background:var(--g);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;margin:0 10px 26px}.logo b{display:inline-grid;place-items:center;width:35px;height:35px;background:var(--a);border-radius:10px;margin-right:10px}.nav button{display:block;width:100%;border:0;background:none;color:#b8cec8;text-align:left;padding:13px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#183b35;color:#fff}.plan{position:absolute;bottom:20px;left:15px;right:15px;border:1px solid #315049;border-radius:10px;padding:14px}.plan small{display:block;color:#9bb8b1;margin-top:5px}main{padding:28px 30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.head h1{margin:0 0 5px;font-size:28px}.muted{color:var(--m)}.btn{border:1px solid var(--b);background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--a);border-color:var(--a);color:#fff}.red{color:var(--r)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #102c280d}.kpi span{font-size:13px;color:var(--m)}.kpi b{display:block;font-size:27px;margin:12px 0}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{padding:11px;border:1px solid var(--b);border-radius:8px;width:100%}.field textarea{min-height:82px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.seg{display:flex;gap:8px;margin-bottom:16px}.seg button{flex:1}.seg .on{background:var(--g);color:#fff;border-color:var(--g)}.rule{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end;border-top:1px solid var(--b);padding:12px 0}.empty{text-align:center;padding:45px 20px;color:var(--m)}.empty b{display:block;color:#172321;font-size:18px;margin-bottom:6px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-top:1px solid var(--b)}th{font-size:11px;color:var(--m)}.phone{max-width:340px;margin:auto;border:8px solid #1b2a27;border-radius:28px;overflow:hidden;background:#eef2f1;min-height:560px}.phone-head{padding:18px;background:var(--g);color:#fff}.phone-body{padding:14px}.phone-card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:15px;margin-bottom:11px}.balance{color:#fff}.balance b{display:block;font-size:30px;margin:7px 0}.checks label{display:flex;gap:8px;margin:10px 0}.modal{position:fixed;inset:0;background:#102c2877;display:grid;place-items:center;padding:15px;z-index:10}.modal form{width:min(480px,100%);background:#fff;border-radius:13px;padding:22px}.toast{position:fixed;right:20px;bottom:20px;background:var(--g);color:#fff;padding:12px 16px;border-radius:8px}.mobile{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.rule{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}aside{display:none}main{padding:18px 15px}.grid,.row{grid-template-columns:1fr}.head h1{font-size:23px}.mobile{display:flex;background:#fff;border-top:1px solid var(--b);justify-content:space-around;padding:8px}.mobile button{border:0;background:none;color:var(--m);font-size:11px;padding:8px}.rule{grid-template-columns:1fr}}</style></head><body><div id="root"></div><div id="modal"></div><div id="toast"></div><script>const F={company:{name:'LoyaltyFlow',email:'',phone:''},clients:[],orders:[],reward:{mode:'cashback',cash:5,maxPay:30,base:'fixed',fixed:100,per100:1,rules:[]},mini:{name:'Моя программа',accent:'#22a77a',head:'#102c28',bg:'#eef2f1',radius:14,title:'Добро пожаловать!',text:'Получайте вознаграждения за покупки.',qr:true,offers:true,history:true}};let s=JSON.parse(localStorage.getItem('LF_RELEASE')||'null')||F,p='Обзор';const P=['Обзор','Клиенты','Вознаграждения','Mini App','Настройки'],save=()=>localStorage.setItem('LF_RELEASE',JSON.stringify(s)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('ru-RU').format(n||0)+' ₽',msg=x=>{toast.innerHTML='<div class="toast">'+esc(x)+'</div>';setTimeout(()=>toast.innerHTML='',1800)},go=x=>{p=x;render()},nav=()=>P.map(x=>'<button class="'+(p===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join(''),shell=x=>'<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+nav()+'</div><div class="plan"><b>Business</b><small>Рабочее пространство владельца</small></div></aside><main>'+x+'</main></div><div class="mobile">'+P.map(x=>'<button onclick="go(\''+x+'\')">'+x+'</button>').join('')+'</div>',head=(a,b)=>'<div class="head"><div><h1>'+a+'</h1><span class="muted">'+b+'</span></div></div>',kpi=(a,b)=>'<div class="card kpi"><span>'+a+'</span><b>'+b+'</b><small class="muted">Актуальные данные</small></div>',empty=(a,b)=>'<div class="empty"><b>'+a+'</b>'+b+'</div>';function reward(sum,product=''){if(s.reward.mode==='cashback')return Math.round(sum*s.reward.cash/100);let r=s.reward.rules.find(x=>(!x.product||x.product.toLowerCase()===product.toLowerCase())&&sum>=x.min);if(r)return r.bonus;return s.reward.base==='fixed'?s.reward.fixed:Math.floor(sum/100)*s.reward.per100}function overview(){let rev=s.orders.reduce((a,x)=>a+x.sum,0),out=s.orders.reduce((a,x)=>a+x.bonus,0);return head('Обзор','Реальные показатели вашего бизнеса')+'<div class="grid">'+kpi('Выручка',money(rev))+kpi('Клиенты',s.clients.length)+kpi('Начислено',money(out))+kpi('Покупки',s.orders.length)+'</div><div class="card"><h2>Последние покупки</h2>'+(!s.orders.length?empty('Данных пока нет','Добавьте клиента и проведите первую покупку.'):orders())+'</div>'}function orders(){return '<div style="overflow:auto"><table><tr><th>Клиент</th><th>Товар</th><th>Сумма</th><th>Начислено</th><th>Дата</th></tr>'+s.orders.map(x=>'<tr><td>'+esc(x.client)+'</td><td>'+esc(x.product||'—')+'</td><td>'+money(x.sum)+'</td><td>'+money(x.bonus)+'</td><td>'+esc(x.date)+'</td></tr>').join('')+'</table></div>'}function clients(){return head('Клиенты','Только реальные участники программы')+'<div class="card"><button class="btn primary" onclick="clientModal()">+ Добавить клиента</button>'+(!s.clients.length?empty('Клиентов пока нет','Добавьте первого участника.'): '<div style="overflow:auto"><table><tr><th>Имя</th><th>Телефон</th><th>Баланс</th><th>Покупки</th><th></th></tr>'+s.clients.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+money(x.balance)+'</td><td>'+money(x.spent)+'</td><td><button class="btn" onclick="orderModal('+i+')">Покупка</button></td></tr>').join('')+'</table></div>')+'</div>'}function rewards(){let r=s.reward;return head('Вознаграждения','Выберите кешбэк или бонусную систему')+'<div class="two"><form class="card" onsubmit="saveReward(event)"><h2>Механика программы</h2><div class="seg"><button type="button" class="btn '+(r.mode==='cashback'?'on':'')+'" onclick="s.reward.mode=\'cashback\';save();render()">Кешбэк</button><button type="button" class="btn '+(r.mode==='bonus'?'on':'')+'" onclick="s.reward.mode=\'bonus\';save();render()">Бонусы</button></div>'+(r.mode==='cashback'?'<div class="row"><div class="field"><label>Кешбэк с покупки, %</label><input name="cash" type="number" min="0" max="100" step=".1" value="'+r.cash+'"></div><div class="field"><label>Можно оплатить до, %</label><input name="maxPay" type="number" min="0" max="100" value="'+r.maxPay+'"></div></div>':'<div class="field"><label>Базовое начисление</label><select name="base"><option value="fixed" '+(r.base==='fixed'?'selected':'')+'>Фиксировано за покупку</option><option value="price" '+(r.base==='price'?'selected':'')+'>За каждые 100 ₽</option></select></div><div class="row"><div class="field"><label>Бонусов за покупку</label><input name="fixed" type="number" min="0" value="'+r.fixed+'"></div><div class="field"><label>Бонусов за 100 ₽</label><input name="per100" type="number" min="0" value="'+r.per100+'"></div></div>')+'<button class="btn primary">Сохранить</button></form><div class="card"><h2>Проверка начисления</h2><div class="field"><label>Сумма покупки</label><input id="sum" type="number" value="1000" oninput="calc()"></div><div class="field"><label>Товар или SKU</label><input id="product" oninput="calc()"></div><p>К начислению: <b id="result">'+money(reward(1000))+'</b></p></div></div>'+(r.mode==='bonus'?'<div class="card"><h2>Особые правила по товару и цене</h2><p class="muted">Оставьте товар пустым, чтобы правило работало для любой покупки от указанной суммы.</p><button class="btn primary" onclick="addRule()">+ Добавить правило</button>'+(r.rules.length?r.rules.map((x,i)=>'<div class="rule"><div class="field"><label>Товар / SKU</label><input value="'+esc(x.product)+'" onchange="setRule('+i+',\'product\',this.value)"></div><div class="field"><label>Цена от, ₽</label><input type="number" value="'+x.min+'" onchange="setRule('+i+',\'min\',+this.value)"></div><div class="field"><label>Начислить</label><input type="number" value="'+x.bonus+'" onchange="setRule('+i+',\'bonus\',+this.value)"></div><button class="btn red" onclick="delRule('+i+')">Удалить</button></div>').join(''):empty('Правил пока нет','Создайте первое правило.'))+'</div>':'')}function mini(){let m=s.mini;return head('Конструктор Mini App','Создайте собственный дизайн приложения')+'<div class="two"><form class="card" onsubmit="saveMini(event)"><h2>Оформление</h2><div class="field"><label>Название</label><input name="name" value="'+esc(m.name)+'"></div><div class="row"><div class="field"><label>Акцент</label><input name="accent" type="color" value="'+m.accent+'"></div><div class="field"><label>Шапка</label><input name="head" type="color" value="'+m.head+'"></div></div><div class="row"><div class="field"><label>Фон</label><input name="bg" type="color" value="'+m.bg+'"></div><div class="field"><label>Скругление, px</label><input name="radius" type="number" min="0" max="32" value="'+m.radius+'"></div></div><div class="field"><label>Заголовок</label><input name="title" value="'+esc(m.title)+'"></div><div class="field"><label>Описание</label><textarea name="text">'+esc(m.text)+'</textarea></div><div class="checks"><label><input name="qr" type="checkbox" '+(m.qr?'checked':'')+'> QR-код</label><label><input name="offers" type="checkbox" '+(m.offers?'checked':'')+'> Предложения</label><label><input name="history" type="checkbox" '+(m.history?'checked':'')+'> История</label></div><button class="btn primary">Сохранить дизайн</button></form><div class="phone" style="background:'+m.bg+'"><div class="phone-head" style="background:'+m.head+'"><b>'+esc(m.name)+'</b></div><div class="phone-body"><div class="phone-card balance" style="background:'+m.accent+';border-radius:'+m.radius+'px"><span>'+esc(m.title)+'</span><b>0</b><small>'+esc(m.text)+'</small></div>'+(m.qr?'<div class="phone-card" style="border-radius:'+m.radius+'px"><b>Мой QR-код</b></div>':'')+(m.offers?'<div class="phone-card" style="border-radius:'+m.radius+'px"><b>Предложения</b><p class="muted">Активные предложения появятся здесь</p></div>':'')+(m.history?'<div class="phone-card" style="border-radius:'+m.radius+'px"><b>История</b><p class="muted">Операций пока нет</p></div>':'')+'</div></div></div>'}function settings(){let c=s.company;return head('Настройки','Данные владельца подписки')+'<form class="card" onsubmit="saveCompany(event)"><div class="row"><div class="field"><label>Компания</label><input name="name" value="'+esc(c.name)+'" required></div><div class="field"><label>Email</label><input name="email" type="email" value="'+esc(c.email)+'"></div></div><div class="field"><label>Телефон</label><input name="phone" value="'+esc(c.phone)+'"></div><button class="btn primary">Сохранить</button></form>'}function show(title,body,submit){modal.innerHTML='<div class="modal" onclick="if(event.target===this)modal.innerHTML=\'\'"><form onsubmit="'+submit+'"><h2>'+title+'</h2>'+body+'<button class="btn primary">Сохранить</button> <button type="button" class="btn" onclick="modal.innerHTML=\'\'">Отмена</button></form></div>'}function clientModal(){show('Новый клиент','<div class="field"><label>Имя</label><input name="name" required></div><div class="field"><label>Телефон</label><input name="phone" required></div>',"event.preventDefault();s.clients.push({name:this.name.value,phone:this.phone.value,balance:0,spent:0});save();modal.innerHTML='';render();msg('Клиент добавлен')")}function orderModal(i){show('Новая покупка','<div class="field"><label>Товар или SKU</label><input name="product"></div><div class="field"><label>Сумма, ₽</label><input name="sum" type="number" min="0" required></div>',"event.preventDefault();let n=+this.sum.value,b=reward(n,this.product.value),c=s.clients["+i+"];c.balance+=b;c.spent+=n;s.orders.unshift({client:c.name,product:this.product.value,sum:n,bonus:b,date:new Date().toLocaleString('ru-RU')});save();modal.innerHTML='';render();msg('Покупка сохранена')")}function saveReward(e){e.preventDefault();let f=new FormData(e.target);if(s.reward.mode==='cashback'){s.reward.cash=+f.get('cash');s.reward.maxPay=+f.get('maxPay')}else{s.reward.base=f.get('base');s.reward.fixed=+f.get('fixed');s.reward.per100=+f.get('per100')}save();render();msg('Настройки сохранены')}function addRule(){s.reward.rules.push({product:'',min:0,bonus:0});save();render()}function setRule(i,k,v){s.reward.rules[i][k]=v;save();calc()}function delRule(i){s.reward.rules.splice(i,1);save();render()}function calc(){result.textContent=money(reward(+sum.value,product.value))}function saveMini(e){e.preventDefault();let f=new FormData(e.target);s.mini={name:f.get('name'),accent:f.get('accent'),head:f.get('head'),bg:f.get('bg'),radius:+f.get('radius'),title:f.get('title'),text:f.get('text'),qr:!!f.get('qr'),offers:!!f.get('offers'),history:!!f.get('history')};save();render();msg('Дизайн Mini App сохранён')}function saveCompany(e){e.preventDefault();let f=new FormData(e.target);s.company={name:f.get('name'),email:f.get('email'),phone:f.get('phone')};save();msg('Данные сохранены')}function render(){let v={'Обзор':overview,'Клиенты':clients,'Вознаграждения':rewards,'Mini App':mini,'Настройки':settings};root.innerHTML=shell(v[p]())}render()</script></body></html>
