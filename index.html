<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoyaltyFlow</title><style>:root{--g:#102c28;--a:#22a77a;--bg:#f3f6f5;--b:#dfe7e4;--m:#71807c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172321;font:15px/1.45 Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:var(--g);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;margin:0 10px 28px}.logo b{display:inline-grid;place-items:center;width:35px;height:35px;background:var(--a);border-radius:11px;margin-right:10px}.nav button{display:block;width:100%;border:0;background:none;color:#b8cec8;text-align:left;padding:13px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.on,.nav button:hover{background:#183b35;color:#fff}main{padding:28px 30px;min-width:0}.head{margin-bottom:22px}.head h1{margin:0 0 5px;font-size:28px}.muted{color:var(--m)}.card{background:#fff;border:1px solid var(--b);border-radius:13px;padding:19px;margin-bottom:16px;box-shadow:0 8px 24px #102c280d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi span{font-size:13px;color:var(--m)}.kpi b{display:block;font-size:27px;margin:12px 0}.btn{border:1px solid var(--b);background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--a);border-color:var(--a);color:#fff}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:8px;background:#fff}.field textarea{min-height:78px}.field input[type=color]{height:47px;padding:4px;cursor:pointer}.field input[type=range]{padding:0;border:0}.seg{display:flex;gap:8px;margin:12px 0 18px}.seg button{flex:1}.seg .on{background:var(--g);color:#fff;border-color:var(--g)}.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result div{padding:15px;border-radius:10px;background:#edf7f3}.result b{display:block;font-size:23px;color:#16845f}.rule{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;border-top:1px solid var(--b);padding:12px 0}.phone{max-width:375px;margin:auto;border:8px solid #172724;border-radius:36px;overflow:hidden;background:#eef2f1;min-height:660px;box-shadow:0 24px 55px #102c2830}.island{width:116px;height:29px;background:#07110f;border-radius:0 0 18px 18px;margin:auto;position:relative;z-index:2}.phone-head{padding:11px 19px 18px;color:#fff}.phone-body{padding:14px}.phone-card{background:#fff;border:1px solid #ffffff80;padding:16px;margin-bottom:11px}.balance{color:#fff}.balance b{display:block;font-size:32px;margin:8px 0}.glass{backdrop-filter:blur(18px);background:#ffffffa8!important;border:1px solid #ffffffb8!important}.checks label{display:flex;align-items:center;gap:8px;margin:9px 0}.notice{padding:12px;border-radius:9px;background:#fff4d8;color:#6d5015;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:10px;font-weight:700}.mobile{display:none}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.rule{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block}aside{display:none}main{padding:18px 15px}.grid,.row,.result{grid-template-columns:1fr}.head h1{font-size:23px}.mobile{display:flex;background:#fff;border-top:1px solid var(--b);justify-content:space-around;padding:8px}.mobile button{border:0;background:none;color:var(--m);font-size:11px;padding:8px}.rule{grid-template-columns:1fr}}</style></head><body><div id="root"></div><div id="toast"></div><script>const defaults={reward:{mode:'cashback',cash:5,maxPay:30,base:'fixed',fixed:100,per100:1,rules:[]},mini:{name:'Моя программа',accent:'#22a77a',header:'#102c28',background:'#eef2f1',card:'#ffffff',text:'#172321',font:'Arial, sans-serif',fontSize:15,titleSize:22,radius:16,spacing:12,glass:true,shadow:true,logo:'',title:'Добро пожаловать!',description:'Получайте вознаграждения за покупки.',qr:true,offers:true,history:true,bot:'',appUrl:'',syncUrl:''}};let s=JSON.parse(localStorage.getItem('LF_V3')||'null')||defaults,page='Обзор';const pages=['Обзор','Вознаграждения','Mini App','Настройки'],save=()=>localStorage.setItem('LF_V3',JSON.stringify(s)),money=n=>new Intl.NumberFormat('ru-RU').format(Number(n)||0)+' ₽',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),msg=x=>{toast.innerHTML='<div style="position:fixed;right:20px;bottom:20px;background:#102c28;color:white;padding:12px 16px;border-radius:9px;z-index:20">'+esc(x)+'</div>';setTimeout(()=>toast.innerHTML='',1800)},go=x=>{page=x;render()},head=(a,b)=>'<div class="head"><h1>'+a+'</h1><span class="muted">'+b+'</span></div>';function shell(body){let n=pages.map(x=>'<button class="'+(page===x?'on':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('');return '<div class="app"><aside><div class="logo"><b>L</b>LoyaltyFlow</div><div class="nav">'+n+'</div></aside><main>'+body+'</main></div><div class="mobile">'+n+'</div>'}function overview(){return head('Обзор','Рабочая версия без демонстрационных данных')+'<div class="grid">'+[['Выручка','0 ₽'],['Клиенты','0'],['Начислено','0 ₽'],['Покупки','0']].map(x=>'<div class="card kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b><small class="muted">Подключите backend для данных</small></div>').join('')+'</div><div class="card"><h2>Подготовка запуска</h2><p>Настройте механику вознаграждений, создайте дизайн Mini App и укажите адрес защищённого backend API.</p></div>'}function rewards(){let r=s.reward;return head('Механика программы','Расчёт обновляется сразу при вводе')+'<div class="two"><form id="rewardForm" class="card" oninput="calcDraft()" onsubmit="saveReward(event)"><h2>Вознаграждение</h2><div class="seg"><button type="button" class="btn '+(r.mode==='cashback'?'on':'')+'" onclick="mode(\'cashback\')">Кешбэк</button><button type="button" class="btn '+(r.mode==='bonus'?'on':'')+'" onclick="mode(\'bonus\')">Бонусы</button></div>'+(r.mode==='cashback'?'<div class="row"><div class="field"><label>Кешбэк с покупки, %</label><input name="cash" type="number" min="0" max="100" step=".1" value="'+r.cash+'"></div><div class="field"><label>Можно оплатить до, %</label><input name="maxPay" type="number" min="0" max="100" step="1" value="'+r.maxPay+'"></div></div>':'<div class="field"><label>Базовый способ</label><select name="base"><option value="fixed" '+(r.base==='fixed'?'selected':'')+'>Фиксировано за покупку</option><option value="price" '+(r.base==='price'?'selected':'')+'>За каждые 100 ₽</option></select></div><div class="row"><div class="field"><label>Бонусов за покупку</label><input name="fixed" type="number" min="0" value="'+r.fixed+'"></div><div class="field"><label>Бонусов за каждые 100 ₽</label><input name="per100" type="number" min="0" value="'+r.per100+'"></div></div>')+'<button class="btn primary">Сохранить механику</button></form><div class="card"><h2>Проверка начисления</h2><div class="field"><label>Сумма покупки</label><input id="testSum" type="number" min="0" value="1000" oninput="calcDraft()"></div><div class="field"><label>Товар / SKU</label><input id="testProduct" oninput="calcDraft()"></div><div class="result"><div>Начислится<b id="earned">—</b></div><div>Можно списать максимум<b id="spend">—</b></div></div></div></div>'+(r.mode==='bonus'?'<div class="card"><h2>Правила по товару или цене</h2><p class="muted">Пустой товар означает правило для любой покупки от указанной суммы.</p><button class="btn primary" onclick="addRule()">+ Правило</button>'+r.rules.map((x,i)=>'<div class="rule"><div class="field"><label>Товар / SKU</label><input value="'+esc(x.product)+'" onchange="rule('+i+',\'product\',this.value)"></div><div class="field"><label>Цена от</label><input type="number" value="'+x.min+'" onchange="rule('+i+',\'min\',+this.value)"></div><div class="field"><label>Бонусов</label><input type="number" value="'+x.bonus+'" onchange="rule('+i+',\'bonus\',+this.value)"></div><button class="btn" onclick="delRule('+i+')">Удалить</button></div>').join('')+'</div>':'')}function draftReward(sum,product){let f=document.querySelector('#rewardForm');if(!f)return 0;let d=new FormData(f);if(s.reward.mode==='cashback')return sum*(Number(d.get('cash'))||0)/100;let hit=s.reward.rules.find(x=>(!x.product||x.product.toLowerCase()===product.toLowerCase())&&sum>=x.min);if(hit)return hit.bonus;return d.get('base')==='fixed'?(Number(d.get('fixed'))||0):Math.floor(sum/100)*(Number(d.get('per100'))||0)}function calcDraft(){let sum=Number(document.querySelector('#testSum')?.value)||0,product=document.querySelector('#testProduct')?.value||'',f=document.querySelector('#rewardForm'),d=f?new FormData(f):null,e=document.querySelector('#earned'),sp=document.querySelector('#spend');if(e)e.textContent=money(draftReward(sum,product));if(sp)sp.textContent=money(sum*(s.reward.mode==='cashback'?(Number(d.get('maxPay'))||0)/100:0))}function mode(x){s.reward.mode=x;save();render()}function saveReward(e){e.preventDefault();let d=new FormData(e.target);if(s.reward.mode==='cashback'){s.reward.cash=+d.get('cash');s.reward.maxPay=+d.get('maxPay')}else{s.reward.base=d.get('base');s.reward.fixed=+d.get('fixed');s.reward.per100=+d.get('per100')}save();calcDraft();msg('Механика сохранена')}function addRule(){s.reward.rules.push({product:'',min:0,bonus:0});save();render()}function rule(i,k,v){s.reward.rules[i][k]=v;save();calcDraft()}function delRule(i){s.reward.rules.splice(i,1);save();render()}function mini(){let m=s.mini;return head('Конструктор Mini App','Все изменения сразу видны в макете')+'<div class="two"><form id="miniForm" class="card" oninput="preview()" onsubmit="applyMini(event)"><h2>Бренд и стиль</h2><div class="field"><label>Название</label><input name="name" value="'+esc(m.name)+'"></div><div class="field"><label>Логотип</label><input name="logo" type="file" accept="image/*" onchange="logoFile(this)"></div><div class="row"><div class="field"><label>Акцент</label><input name="accent" type="color" value="'+m.accent+'"></div><div class="field"><label>Шапка</label><input name="header" type="color" value="'+m.header+'"></div><div class="field"><label>Фон</label><input name="background" type="color" value="'+m.background+'"></div><div class="field"><label>Карточки</label><input name="card" type="color" value="'+m.card+'"></div><div class="field"><label>Текст</label><input name="text" type="color" value="'+m.text+'"></div><div class="field"><label>Шрифт</label><select name="font"><option value="Arial, sans-serif">Arial</option><option value="Georgia, serif">Georgia</option><option value="Verdana, sans-serif">Verdana</option><option value="Courier New, monospace">Mono</option></select></div><div class="field"><label>Размер текста</label><input name="fontSize" type="number" min="12" max="22" value="'+m.fontSize+'"></div><div class="field"><label>Размер заголовка</label><input name="titleSize" type="number" min="16" max="36" value="'+m.titleSize+'"></div><div class="field"><label>Скругление</label><input name="radius" type="range" min="0" max="32" value="'+m.radius+'"></div><div class="field"><label>Отступы</label><input name="spacing" type="range" min="6" max="24" value="'+m.spacing+'"></div></div><div class="field"><label>Заголовок</label><input name="title" value="'+esc(m.title)+'"></div><div class="field"><label>Описание</label><textarea name="description">'+esc(m.description)+'</textarea></div><div class="checks"><label><input name="glass" type="checkbox" '+(m.glass?'checked':'')+'> Эффект «линзы» / стекла</label><label><input name="shadow" type="checkbox" '+(m.shadow?'checked':'')+'> Тени</label><label><input name="qr" type="checkbox" '+(m.qr?'checked':'')+'> QR-код</label><label><input name="offers" type="checkbox" '+(m.offers?'checked':'')+'> Предложения</label><label><input name="history" type="checkbox" '+(m.history?'checked':'')+'> История</label></div><h2>Подключение Telegram</h2><div class="field"><label>Username бота</label><input name="bot" placeholder="my_loyalty_bot" value="'+esc(m.bot)+'"></div><div class="field"><label>Публичный URL Mini App</label><input name="appUrl" type="url" placeholder="https://example.com/app" value="'+esc(m.appUrl)+'"></div><div class="field"><label>URL защищённого backend API</label><input name="syncUrl" type="url" placeholder="https://api.example.com/telegram/apply" value="'+esc(m.syncUrl)+'"></div><div class="notice">Токен Telegram-бота нельзя хранить в браузере. Он должен находиться только на backend-сервере.</div><div class="actions"><button class="btn primary">Сохранить и применить</button><button type="button" class="btn" onclick="exportDesign()">Скачать JSON</button></div><div id="syncStatus" class="status"></div></form><div id="phone"></div></div>'}function readMini(){let f=document.querySelector('#miniForm'),d=new FormData(f);return{name:d.get('name'),accent:d.get('accent'),header:d.get('header'),background:d.get('background'),card:d.get('card'),text:d.get('text'),font:d.get('font'),fontSize:+d.get('fontSize'),titleSize:+d.get('titleSize'),radius:+d.get('radius'),spacing:+d.get('spacing'),glass:!!d.get('glass'),shadow:!!d.get('shadow'),title:d.get('title'),description:d.get('description'),qr:!!d.get('qr'),offers:!!d.get('offers'),history:!!d.get('history'),bot:d.get('bot'),appUrl:d.get('appUrl'),syncUrl:d.get('syncUrl'),logo:s.mini.logo||''}}function preview(){let m=readMini(),shadow=m.shadow?'0 14px 35px #102c2825':'none',card='background:'+m.card+';border-radius:'+m.radius+'px;box-shadow:'+shadow,block=x=>'<div class="phone-card '+(m.glass?'glass':'')+'" style="'+card+'">'+x+'</div>';phone.innerHTML='<div class="phone" style="background:'+m.background+';font-family:'+m.font+';font-size:'+m.fontSize+'px;color:'+m.text+'"><div class="island"></div><div class="phone-head" style="background:'+m.header+';padding-left:'+m.spacing+'px">'+(m.logo?'<img src="'+m.logo+'" style="width:30px;height:30px;border-radius:9px;object-fit:cover;vertical-align:middle;margin-right:8px">':'')+'<b>'+esc(m.name)+'</b></div><div class="phone-body" style="padding:'+m.spacing+'px"><div class="phone-card balance" style="background:'+m.accent+';border-radius:'+m.radius+'px;box-shadow:'+shadow+'"><strong style="font-size:'+m.titleSize+'px">'+esc(m.title)+'</strong><b>0</b><small>'+esc(m.description)+'</small></div>'+(m.qr?block('<b>Мой QR-код</b>'):'')+(m.offers?block('<b>Предложения</b><p>Активные предложения появятся здесь</p>'):'')+(m.history?block('<b>История</b><p>Операций пока нет</p>'):'')+'</div></div>'}function logoFile(i){let f=i.files[0];if(!f)return;if(f.size>500000)return msg('Логотип должен быть меньше 500 КБ');let r=new FileReader;r.onload=()=>{s.mini.logo=r.result;preview()};r.readAsDataURL(f)}async function applyMini(e){e.preventDefault();s.mini=readMini();save();preview();let st=document.querySelector('#syncStatus');if(!s.mini.syncUrl){st.textContent='Дизайн сохранён локально. Укажите backend API для применения в Telegram.';return}st.textContent='Отправляем настройки…';try{let r=await fetch(s.mini.syncUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot:s.mini.bot,appUrl:s.mini.appUrl,design:s.mini})});if(!r.ok)throw Error('HTTP '+r.status);st.textContent='Настройки отправлены и применены через backend API.'}catch(e){st.textContent='Не удалось применить: '+e.message}}function exportDesign(){let m=readMini(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(m,null,2)],{type:'application/json'}));a.download='loyaltyflow-mini-app.json';a.click()}function settings(){return head('Настройки','Интеграции и публикация')+'<div class="card"><h2>Что нужно для Telegram API</h2><ol><li>Публичный HTTPS-адрес Mini App.</li><li>Backend endpoint, который хранит токен бота в секрете.</li><li>На backend — вызов Telegram Bot API <code>setChatMenuButton</code> и сохранение JSON-дизайна в базе.</li></ol><p class="muted">Интерфейс уже отправляет дизайн на указанный endpoint. Следующий этап — подключить Supabase Edge Function или другой сервер.</p></div>'}function render(){let v={'Обзор':overview,'Вознаграждения':rewards,'Mini App':mini,'Настройки':settings};root.innerHTML=shell(v[page]());if(page==='Вознаграждения')calcDraft();if(page==='Mini App'){let f=document.querySelector('#miniForm');f.font.value=s.mini.font;preview()}}render()</script></body></html>
