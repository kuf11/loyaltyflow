<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><title>LoyaltyFlow</title><style>*{box-sizing:border-box}:root{--a:#1684ff}body{margin:0;background:#07090d;color:#f7f9fb;font:15px/1.4 Arial,sans-serif;padding-bottom:84px}.head{position:sticky;top:0;z-index:5;padding:calc(13px + env(safe-area-inset-top)) 14px 13px;background:#111923;display:flex;gap:9px;align-items:center}.head img,.logo{width:36px;height:36px;border-radius:11px;object-fit:cover;background:#5eead4}.body{padding:12px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border-radius:20px;background:#1d2731;margin-bottom:10px;border:1px solid #ffffff12}.balance strong{display:block;font-size:32px;margin:11px 0}.qr{background:var(--a);text-align:center}.qrbox{width:104px;height:104px;padding:7px;background:#fff;border-radius:11px;margin:7px auto}.qrbox img,.qrbox canvas{width:90px!important;height:90px!important}.promo{min-height:130px;background:linear-gradient(145deg,#1684ff,#6657ff)}.search{width:100%;border:0;border-radius:12px;padding:12px;background:#ffffff13;color:#fff}.cats{display:flex;gap:7px;overflow:auto;margin:10px 0}.chip{border:0;border-radius:99px;padding:8px 12px;background:#ffffff13;color:#fff;white-space:nowrap}.chip.on{background:var(--a)}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:9px}.product{overflow:hidden;border-radius:17px;background:#1d2731}.product img,.photo{display:block;width:100%;height:115px;object-fit:cover;background:#202936}.info{padding:11px}.price{font-size:18px;font-weight:800;margin:6px 0}.add{width:100%;border:0;border-radius:10px;padding:9px;background:var(--a);color:#fff;font-weight:700}.empty{grid-column:1/-1;text-align:center;color:#98a1ae;padding:25px}.bottom{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:9;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;background:#171d25ef;backdrop-filter:blur(16px);border:1px solid #ffffff18;border-radius:20px}.bottom button{border:0;background:none;color:#c2c8d0;padding:7px 2px}.cartbar{position:fixed;left:15px;right:15px;bottom:86px;border:0;border-radius:14px;padding:13px;background:var(--a);color:#fff;font-weight:800;z-index:8}.hide{display:none}.modal{position:fixed;inset:0;background:#000c;z-index:20;display:grid;align-items:end}.sheet{background:#fff;color:#16202a;padding:20px;border-radius:23px 23px 0 0}.pay{width:100%;border:0;padding:13px;border-radius:11px;background:var(--a);color:#fff;font-weight:800}@media(max-width:350px){.hero{grid-template-columns:1fr}.qrbox{width:94px;height:94px}.qrbox img,.qrbox canvas{width:80px!important;height:80px!important}}</style></head><body><div id="app">Загрузка…</div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const tenant=new URLSearchParams(location.search).get('tenant')||'main',client=tg?.initDataUnsafe?.user?.id||'demo',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d={},products=[],cart={},cat='Все';const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';function home(){let cats=['Все',...new Set(products.map(x=>x.category).filter(Boolean))];app.innerHTML='<header class="head">'+(d.logo?'<img src="'+d.logo+'">':'<div class="logo"></div>')+'<b>'+esc(d.name||'LoyaltyFlow')+'</b></header><main class="body"><div class="hero"><section class="card balance"><span>'+esc(d.balanceLabel||'Ваш баланс')+'</span><strong>0</strong><small>Бонусы за покупки</small></section>'+(d.qr!==false?'<section class="card qr"><b>Мой QR</b><div id="qr" class="qrbox"></div><small>Покажите при покупке</small></section>':'')+'</div><section class="card promo"><h2>'+esc(d.title||'Добро пожаловать!')+'</h2><p>'+esc(d.description||'Получайте бонусы за покупки.')+'</p></section>'+(d.catalog!==false?'<h2>Каталог</h2><input class="search" placeholder="Поиск" oninput="draw(this.value)"><div class="cats">'+cats.map(x=>'<button class="chip '+(x===cat?'on':'')+'" onclick="setCat(\''+esc(x)+'\')">'+esc(x)+'</button>').join('')+'</div><div id="catalog" class="catalog"></div>':'')+'</main><nav class="bottom"><button onclick="home()">⌂<br>Главная</button><button onclick="document.getElementById(\'qr\')?.scrollIntoView()">▦<br>QR</button><button onclick="document.getElementById(\'catalog\')?.scrollIntoView()">▤<br>Каталог</button><button onclick="checkout()">🛒<br>Корзина</button></nav><button id="cart" class="cartbar hide" onclick="checkout()"></button>';if(document.getElementById('qr')&&window.QRCode)new QRCode('qr',{text:'loyaltyflow:'+tenant+':'+client,width:90,height:90});if(document.getElementById('catalog'))draw('')}function draw(q=''){let x=products.filter(p=>(cat==='Все'||p.category===cat)&&p.name.toLowerCase().includes(q.toLowerCase()));catalog.innerHTML=x.length?x.map(p=>'<article class="product">'+(p.image?'<img src="'+esc(p.image)+'">':'<div class="photo"></div>')+'<div class="info"><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div><small>+'+(p.bonus||0)+' бонусов</small><button class="add" onclick="add(\''+p.id+'\')">Добавить</button></div></article>').join(''):'<div class="empty">Каталог пока пуст</div>';update()}function setCat(x){cat=x;home()}function add(id){cart[id]=(cart[id]||0)+1;update()}function update(){let n=Object.values(cart).reduce((a,b)=>a+b,0),sum=products.reduce((a,p)=>a+(cart[p.id]||0)*p.price,0),b=document.getElementById('cart');if(b){b.classList.toggle('hide',!n);b.textContent='Корзина · '+n+' · '+money(sum)}}function checkout(){let items=products.filter(p=>cart[p.id]),sum=items.reduce((a,p)=>a+(cart[p.id]||0)*p.price,0);if(!items.length)return tg?.showAlert?.('Корзина пуста');let m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><h2>Заказ</h2>'+items.map(p=>'<p>'+esc(p.name)+' × '+cart[p.id]+'</p>').join('')+'<h3>'+money(sum)+'</h3><p>Тестовый режим — деньги не списываются.</p><button class="pay" onclick="this.textContent=\'Оплата успешна ✓\';cart={};update();setTimeout(()=>this.closest(\'.modal\').remove(),1200)">Оплатить</button></div>';document.body.append(m)}fetch('/api/v1/public/'+encodeURIComponent(tenant)+'/config',{cache:'no-store'}).then(r=>r.json()).then(x=>{d=x.design||{};products=(d.products||[]).filter(p=>Number(p.stock||0)>0);home();tg?.setHeaderColor?.('#111923');tg?.setBackgroundColor?.('#07090d')}).catch(e=>app.innerHTML='<p style="padding:20px">'+esc(e.message)+'</p>');</script></body></html>
