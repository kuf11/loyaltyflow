<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><title>LoyaltyFlow Mini App</title><style>:root{--accent:#1684ff;--head:#101820;--bg:#07090d;--card:#1d2731;--text:#f7f9fb;--radius:20px;--space:14px;--fs:15px;--title:25px;--font:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.4 var(--font);min-height:100vh;padding-bottom:88px}.head{background:var(--head);padding:calc(14px + env(safe-area-inset-top)) var(--space) 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.head img{width:38px;height:38px;border-radius:12px;object-fit:cover}.body{padding:var(--space)}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:var(--space);border:1px solid #ffffff12}.balance strong{display:block;font-size:36px;margin:14px 0}.qr-card{background:var(--accent);text-align:center}.qr-box{background:#fff;padding:8px;border-radius:13px;width:134px;height:134px;margin:8px auto}.qr-box img,.qr-box canvas{width:118px!important;height:118px!important}.promo{background:linear-gradient(145deg,var(--accent),#6657ff);min-height:150px}.search{width:100%;padding:13px;border:0;border-radius:13px;background:#ffffff12;color:var(--text);margin:8px 0 13px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{border:0;border-radius:99px;padding:9px 13px;background:#ffffff12;color:var(--text);white-space:nowrap}.chip.on{background:var(--accent)}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid #ffffff12}.product img{width:100%;height:130px;object-fit:cover;background:#ffffff0a}.product-body{padding:12px}.price{font-size:19px;font-weight:800;margin:7px 0}.add{width:100%;border:0;border-radius:11px;padding:10px;background:var(--accent);color:#fff;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:#9aa5af;padding:30px}.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:8;background:#171d25eF;backdrop-filter:blur(18px);border:1px solid #ffffff18;border-radius:22px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:none;color:#aeb7c0;padding:8px 2px;font-size:11px}.bottom b{display:block;font-size:18px;color:#fff}.cartbar{position:fixed;left:18px;right:18px;bottom:92px;background:var(--accent);color:#fff;border:0;border-radius:15px;padding:14px;font-weight:800;z-index:7}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:end center}.sheet{background:#fff;color:#172321;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:22px}.sheet button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800}.loading{display:grid;place-items:center;min-height:100vh}.hide{display:none}</style></head><body><div id="app" class="loading">Загрузка…</div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const tenant=new URLSearchParams(location.search).get('tenant')||'main',client=tg?.initDataUnsafe?.user?.id||'demo',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let design={},products=[],cart={},category='Все';function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₽'}function apply(d){let s=document.documentElement.style;for(let [k,v] of [['--accent',d.accent],['--head',d.header],['--bg',d.background],['--card',d.card],['--text',d.text]])if(v)s.setProperty(k,v);s.setProperty('--radius',(d.radius||20)+'px');s.setProperty('--space',(d.spacing||14)+'px');s.setProperty('--fs',(d.fontSize||15)+'px');s.setProperty('--title',(d.titleSize||25)+'px');s.setProperty('--font',d.font||'Arial,sans-serif')}function home(){let cats=['Все',...new Set(products.map(x=>x.category).filter(Boolean))];app.className='';app.innerHTML='<div class="head">'+(design.logo?'<img src="'+esc(design.logo)+'">':'')+'<b>'+esc(design.name||'LoyaltyFlow')+'</b></div><div class="body"><div class="hero"><section class="card balance"><span>'+esc(design.balanceLabel||'Мои баллы')+'</span><strong>0</strong><small>Получайте бонусы за покупки</small></section><section class="card qr-card"><b>Мой QR</b><div id="qr" class="qr-box"></div><small>Покажите при покупке</small></section></div><section class="card promo"><h2>'+esc(design.title||'Добро пожаловать!')+'</h2><p>'+esc(design.description||'')+'</p></section><h2>Каталог</h2><input class="search" placeholder="Поиск товаров" oninput="drawProducts(this.value)"><div class="cats">'+cats.map(x=>'<button class="chip '+(x===category?'on':'')+'" onclick="setCat(\''+esc(x)+'\')">'+esc(x)+'</button>').join('')+'</div><div id="catalog" class="catalog"></div></div><nav class="bottom"><button onclick="home()"><b>⌂</b>Главная</button><button onclick="document.querySelector(\'#qr\')?.scrollIntoView()"><b>▦</b>QR</button><button onclick="document.querySelector(\'#catalog\')?.scrollIntoView()"><b>▤</b>Каталог</button><button onclick="checkout()"><b>🛒</b>Корзина</button></nav><button id="cartbar" class="cartbar hide" onclick="checkout()"></button>';new QRCode(document.querySelector('#qr'),{text:'loyaltyflow:'+tenant+':'+client,width:118,height:118,correctLevel:QRCode.CorrectLevel.M});drawProducts('')}function drawProducts(q=''){let list=products.filter(p=>(category==='Все'||p.category===category)&&String(p.name).toLowerCase().includes(q.toLowerCase()));catalog.innerHTML=list.length?list.map(p=>'<article class="product">'+(p.image?'<img src="'+esc(p.image)+'">':'<div style="height:130px;background:#ffffff0a"></div>')+'<div class="product-body"><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div><small>+'+Number(p.bonus||0)+' бонусов</small><button class="add" onclick="addCart(\''+p.id+'\')">Добавить</button></div></article>').join(''):'<div class="empty">Каталог пока пуст</div>';updateCart()}function setCat(x){category=x;home()}function addCart(id){cart[id]=(cart[id]||0)+1;tg?.HapticFeedback?.impactOccurred('light');updateCart()}function updateCart(){let count=Object.values(cart).reduce((a,b)=>a+b,0),sum=products.reduce((a,p)=>a+(cart[p.id]||0)*Number(p.price||0),0),b=document.querySelector('#cartbar');if(!b)return;b.classList.toggle('hide',!count);b.textContent='Корзина · '+count+' · '+money(sum)}function checkout(){let items=products.filter(p=>cart[p.id]).map(p=>({...p,qty:cart[p.id]})),sum=items.reduce((a,p)=>a+p.qty*Number(p.price||0),0);if(!items.length)return tg?.showAlert?.('Корзина пуста');let m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><h2>Ваш заказ</h2>'+items.map(p=>'<p>'+esc(p.name)+' × '+p.qty+' — '+money(p.price*p.qty)+'</p>').join('')+'<h3>Итого: '+money(sum)+'</h3><p>Тестовый режим: деньги не списываются.</p><button onclick="testPay(this)">Оплатить в тестовом режиме</button><p style="text-align:center" onclick="this.closest(\'.modal\').remove()">Закрыть</p></div>';document.body.append(m)}function testPay(btn){btn.disabled=true;btn.textContent='Оплата прошла успешно ✓';cart={};updateCart();tg?.HapticFeedback?.notificationOccurred('success');setTimeout(()=>btn.closest('.modal').remove(),1500)}fetch('/api/v1/public/'+encodeURIComponent(tenant)+'/config',{cache:'no-store'}).then(r=>r.json()).then(x=>{design=x.design||{};products=Array.isArray(design.products)?design.products.filter(p=>Number(p.stock||0)>0):[];apply(design);home();tg?.setHeaderColor?.(design.header||'#101820');tg?.setBackgroundColor?.(design.background||'#07090d')}).catch(e=>{app.textContent=e.message})</script></body></html>
