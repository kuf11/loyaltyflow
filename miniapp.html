<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><title>LoyaltyFlow</title><style>*{box-sizing:border-box}:root{--cyan:#18d6c1;--pink:#f52a88;--glass:rgba(32,40,59,.58);--line:rgba(255,255,255,.18)}html{background:#09101d}body{margin:0;min-height:100vh;color:#f7f8ff;font:15px/1.4 Arial,sans-serif;padding-bottom:104px;background:radial-gradient(circle at 18% 5%,rgba(181,25,104,.52),transparent 31%),radial-gradient(circle at 92% 38%,rgba(23,83,180,.55),transparent 42%),linear-gradient(155deg,#151020 0,#0b101c 44%,#101b32 100%);background-attachment:fixed}.top{position:sticky;top:0;z-index:8;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,12,22,.36);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.08)}.identity{display:flex;align-items:center;gap:10px}.top img,.logo{width:40px;height:40px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--pink),#7c3aed)}.company{font-size:17px;font-weight:800}.top-actions{display:flex;gap:8px}.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;backdrop-filter:blur(18px)}main{padding:18px 16px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#d1c8de;font-weight:800;margin:4px 2px 12px}.glass{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 18px 45px rgba(0,0,0,.24);backdrop-filter:blur(22px)}.hero{border-radius:28px;padding:20px;position:relative;overflow:hidden;margin-bottom:14px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-65px;top:-70px;background:radial-gradient(circle,var(--pink),transparent 67%);opacity:.38}.hero-head{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.balance-label{color:#d7d4df}.balance{font-size:44px;font-weight:900;margin:14px 0 5px;letter-spacing:-.04em}.balance small{font-size:18px;color:var(--cyan)}.progress{height:7px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:17px 0 10px}.progress i{display:block;width:36%;height:100%;background:linear-gradient(90deg,#3785ff,var(--pink));border-radius:99px}.hero-note{color:#bfc5d4;font-size:13px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:17px}.quick-card{min-height:174px;border-radius:25px;padding:16px}.qr-title{display:flex;justify-content:space-between;align-items:center;font-weight:800}.qrbox{width:116px;height:116px;margin:10px auto 2px;padding:8px;background:#fff;border-radius:18px;box-shadow:0 12px 28px rgba(0,0,0,.25)}.qrbox img,.qrbox canvas{width:100px!important;height:100px!important}.welcome{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,rgba(255,45,143,.5),rgba(49,84,210,.35))}.welcome h2{font-size:23px;margin:0 0 8px}.welcome p{margin:0;color:#e8e7ee}.glass-button{border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px 14px;background:linear-gradient(145deg,rgba(255,255,255,.23),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.2);backdrop-filter:blur(18px);color:#fff;font-weight:800}.glass-button:active{transform:scale(.98)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 10px}.section-title h2{margin:0;font-size:27px}.search{width:100%;padding:13px 15px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);color:#fff;outline:none}.search::placeholder{color:#aeb5c6}.categories{display:flex;gap:8px;overflow:auto;padding:10px 0 13px;scrollbar-width:none}.chip{border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:rgba(255,255,255,.07);color:#d9deea;white-space:nowrap;backdrop-filter:blur(15px)}.chip.on{background:linear-gradient(100deg,rgba(245,42,136,.66),rgba(94,63,215,.65));color:#fff}.catalog{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{border-radius:23px;overflow:hidden}.product img,.photo{width:100%;height:132px;display:block;object-fit:cover;background:linear-gradient(135deg,rgba(245,42,136,.22),rgba(43,105,210,.22))}.info{padding:13px}.info b{display:block;font-size:16px}.price{font-size:20px;font-weight:900;margin:7px 0}.bonus{color:#ffe078;font-size:12px}.add{width:100%;margin-top:10px}.empty{grid-column:1/-1;padding:28px;text-align:center;border-radius:22px;color:#b7becc}.cartbar{position:fixed;z-index:12;left:16px;right:16px;bottom:101px;padding:14px;border:1px solid rgba(255,255,255,.3);border-radius:18px;background:linear-gradient(90deg,rgba(245,42,136,.88),rgba(55,101,220,.88));backdrop-filter:blur(20px);color:#fff;font-weight:900}.hide{display:none}.bottom{position:fixed;z-index:13;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:8px;display:grid;grid-template-columns:repeat(4,1fr);border-radius:26px}.bottom button{border:0;background:none;color:#aab1c1;padding:7px 2px;font-size:11px}.bottom b{display:block;font-size:20px;color:#fff;margin-bottom:2px}.bottom .active{border-radius:18px;background:rgba(255,255,255,.14);color:#fff}.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.68);display:grid;align-items:end}.sheet{padding:22px;border-radius:28px 28px 0 0;background:rgba(22,29,44,.96);border-top:1px solid var(--line);backdrop-filter:blur(28px)}.sheet-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1)}.pay{width:100%;margin-top:15px}.loading{display:grid;place-items:center;min-height:100vh;color:#c9cfda}@media(max-width:360px){main{padding:14px 12px}.quick{gap:8px}.quick-card{padding:12px;min-height:160px}.qrbox{width:100px;height:100px}.qrbox img,.qrbox canvas{width:84px!important;height:84px!important}.welcome h2{font-size:20px}.catalog{gap:8px}}</style></head><body><div id="app" class="loading">Загрузка программы…</div><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const tenant=new URLSearchParams(location.search).get('tenant')||'main',client=tg?.initDataUnsafe?.user?.id||'demo',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d={},products=[],cart={},category='Все';const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';function render(){const cats=['Все',...new Set(products.map(x=>x.category).filter(Boolean))];app.className='';app.innerHTML='<header class="top"><div class="identity">'+(d.logo?'<img src="'+esc(d.logo)+'">':'<div class="logo"></div>')+'<div><div class="company">'+esc(d.name||'LoyaltyFlow')+'</div><small>Программа лояльности</small></div></div><div class="top-actions"><button class="round">◐</button><button class="round">•••</button></div></header><main><div class="eyebrow">Главная</div><section class="hero glass"><div class="hero-head"><span class="balance-label">'+esc(d.balanceLabel||'Ваш баланс')+'</span><span>● MAIN</span></div><div class="balance">0 <small>бонусов</small></div><div class="progress"><i></i></div><div class="hero-note">Получайте больше выгоды с каждой покупкой</div></section><div class="quick">'+(d.qr!==false?'<section class="quick-card glass"><div class="qr-title"><span>Мой QR</span><span>↗</span></div><div id="qr" class="qrbox"></div></section>':'')+'<section class="quick-card glass welcome"><div><h2>'+esc(d.title||'Добро пожаловать!')+'</h2><p>'+esc(d.description||'Получайте бонусы за покупки.')+'</p></div><button class="glass-button" onclick="document.getElementById(\'catalog\')?.scrollIntoView()">'+esc(d.buttonText||'Перейти в каталог')+'</button></section></div>'+(d.catalog!==false?'<div class="section-title"><h2>Каталог</h2><span>⌕</span></div><input class="search" placeholder="Поиск товаров" oninput="drawProducts(this.value)"><div class="categories">'+cats.map(x=>'<button class="chip '+(x===category?'on':'')+'" onclick="setCategory(\''+esc(x)+'\')">'+esc(x)+'</button>').join('')+'</div><div id="catalog" class="catalog"></div>':'')+'</main><button id="cartbar" class="cartbar hide" onclick="checkout()"></button><nav class="bottom glass"><button class="active" onclick="render()"><b>⌂</b>Главная</button><button onclick="document.getElementById(\'qr\')?.scrollIntoView({behavior:\'smooth\'})"><b>▦</b>QR</button><button onclick="document.getElementById(\'catalog\')?.scrollIntoView({behavior:\'smooth\'})"><b>▤</b>Каталог</button><button onclick="checkout()"><b>◈</b>Корзина</button></nav>';if(document.getElementById('qr')&&window.QRCode)new QRCode('qr',{text:'loyaltyflow:'+tenant+':'+client,width:100,height:100,correctLevel:QRCode.CorrectLevel.M});if(document.getElementById('catalog'))drawProducts('')}function drawProducts(query=''){const list=products.filter(p=>(category==='Все'||p.category===category)&&String(p.name).toLowerCase().includes(query.toLowerCase()));catalog.innerHTML=list.length?list.map(p=>'<article class="product glass">'+(p.image?'<img src="'+esc(p.image)+'">':'<div class="photo"></div>')+'<div class="info"><b>'+esc(p.name)+'</b><div class="price">'+money(p.price)+'</div><span class="bonus">+'+Number(p.bonus||0)+' бонусов</span><button class="glass-button add" onclick="addToCart(\''+p.id+'\')">Добавить</button></div></article>').join(''):'<div class="empty glass">Каталог пока пуст</div>';updateCart()}function setCategory(value){category=value;render()}function addToCart(id){cart[id]=(cart[id]||0)+1;tg?.HapticFeedback?.impactOccurred('light');updateCart()}function updateCart(){const count=Object.values(cart).reduce((a,b)=>a+b,0),sum=products.reduce((a,p)=>a+(cart[p.id]||0)*Number(p.price||0),0),bar=document.getElementById('cartbar');if(bar){bar.classList.toggle('hide',!count);bar.textContent='Корзина · '+count+' · '+money(sum)}}function checkout(){const items=products.filter(p=>cart[p.id]),sum=items.reduce((a,p)=>a+(cart[p.id]||0)*Number(p.price||0),0);if(!items.length)return tg?.showAlert?.('Корзина пуста');const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<div class="sheet"><h2>Ваш заказ</h2>'+items.map(p=>'<div class="sheet-line"><span>'+esc(p.name)+' × '+cart[p.id]+'</span><b>'+money(p.price*cart[p.id])+'</b></div>').join('')+'<h2>Итого: '+money(sum)+'</h2><p>Тестовый режим — деньги не списываются.</p><button class="glass-button pay" onclick="this.textContent=\'Оплата успешна ✓\';cart={};updateCart();setTimeout(()=>this.closest(\'.modal\').remove(),1200)">Оплатить</button></div>';document.body.append(modal)}fetch('/api/v1/public/'+encodeURIComponent(tenant)+'/config',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Программа не найдена');return r.json()}).then(x=>{d=x.design||{};products=(d.products||[]).filter(p=>Number(p.stock||0)>0);render();tg?.setHeaderColor?.('#151020');tg?.setBackgroundColor?.('#09101d')}).catch(error=>{app.className='loading';app.textContent=error.message});</script></body></html>
